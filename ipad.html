<!DOCTYPE html>
<html lang="ru" manifest="ipad.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fire Chords">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="fire-180.png">
<title>Fire Chords для iPad</title>
<!--
  A lightweight songbook for old iPads (iOS 9, Safari 9): plain ES5, flexbox without gap,
  no service worker (AppCache keeps it offline), data pulled read-only from the GitHub sync file.
-->
<style>
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45;background:#F1F2EE;color:#191B19;-webkit-text-size-adjust:100%}
body.dark{background:#141615;color:#ECEEE9}
a{color:#1A57AE}
body.dark a{color:#86B6FF}
button{font-family:inherit;font-size:16px;cursor:pointer}
.bar{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:rgba(241,242,238,.96);border-bottom:1px solid #D3D8CD}
body.dark .bar{background:rgba(20,22,21,.96);border-color:#2F3430}
.bar-in{max-width:960px;margin:0 auto;padding:10px 20px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.bar-in>*{margin-right:10px}
.bar-in>*:last-child{margin-right:0}
.grow{-webkit-flex:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-weight:700;font-size:21px}
.btn{border:1px solid #D3D8CD;background:#fff;color:#191B19;border-radius:10px;padding:8px 14px;min-height:42px}
.btn.primary{background:#1A57AE;border-color:#1A57AE;color:#fff;font-weight:600}
body.dark .btn{background:#1F2321;border-color:#2F3430;color:#ECEEE9}
body.dark .btn.primary{background:#86B6FF;border-color:#86B6FF;color:#0A1424}
.wrap{max-width:960px;margin:0 auto;padding:14px 20px 120px}
input,textarea{font-family:inherit;font-size:16px;border:1px solid #D3D8CD;border-radius:10px;padding:10px 12px;width:100%;-webkit-box-sizing:border-box;box-sizing:border-box;background:#fff;color:#191B19}
body.dark input,body.dark textarea{background:#1F2321;border-color:#2F3430;color:#ECEEE9}
textarea{font-family:Menlo,monospace;min-height:160px}
.songs{list-style:none;margin:10px 0 0;padding:0}
.songs li{border-top:1px solid #D3D8CD}
body.dark .songs li{border-color:#2F3430}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:14px 4px;width:100%;background:none;border:0;text-align:left;color:inherit}
.row .t{font-weight:600;font-size:18px}
.row .a{color:#636A61;font-size:15px}
body.dark .row .a{color:#9BA298}
.note{color:#636A61;font-size:15px}
body.dark .note{color:#9BA298}
h1{font-size:28px;line-height:1.2;margin:6px 0 2px}
.by{color:#636A61;margin:0 0 6px}
body.dark .by{color:#9BA298}
.strip{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0}
.chip{display:inline-block;vertical-align:top;width:90px;margin-right:8px;background:#fff;border:1px solid #D3D8CD;border-radius:12px;padding:6px 4px 4px;text-align:center;color:inherit}
body.dark .chip{background:#1F2321;border-color:#2F3430}
.chip .n{display:block;font-family:Menlo,monospace;font-weight:700;color:#1A57AE;font-size:15px}
body.dark .chip .n{color:#86B6FF}
.sheet{font-family:Menlo,monospace;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;line-height:1.4;padding:6px 0 20px}
.ch{color:#1A57AE;font-weight:700}
body.dark .ch{color:#86B6FF}
.ch span{cursor:pointer}
.head{font-family:-apple-system,"Helvetica Neue",Helvetica,sans-serif;font-weight:600;color:#636A61;font-size:.85em;margin-top:.5em}
body.dark .head{color:#9BA298}
.gap{height:.8em}
.tools{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(241,242,238,.97);border-top:1px solid #D3D8CD}
body.dark .tools{background:rgba(20,22,21,.97);border-color:#2F3430}
.tools-in{max-width:960px;margin:0 auto;padding:8px 20px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.grp{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#E5E8E1;border-radius:12px;padding:3px;margin:3px 10px 3px 0}
body.dark .grp{background:#232724}
.grp button{background:none;border:0;min-width:44px;height:40px;border-radius:9px;color:inherit;font-weight:600}
.grp button.on{background:#1A57AE;color:#fff}
body.dark .grp button.on{background:#86B6FF;color:#0A1424}
.grp .lbl{font-family:Menlo,monospace;font-weight:700;min-width:36px;text-align:center;font-size:14px}
.grp .cap{font-size:12px;color:#636A61;padding:0 6px}
.grp input[type=range]{width:180px;border:0;padding:0;background:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.45);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.panel{background:#fff;border-radius:18px;padding:18px 22px;width:320px;text-align:center}
body.dark .panel{background:#1F2321}
.panel h2{font-family:Menlo,monospace;color:#1A57AE;margin:0 0 6px;font-size:30px}
body.dark .panel h2{color:#86B6FF}
.panel .info{font-family:Menlo,monospace;font-size:14px;color:#636A61;margin-top:8px}
.set{margin-top:28px;padding-top:8px;border-top:1px solid #D3D8CD}
body.dark .set{border-color:#2F3430}
.set h3{font-size:17px;margin:12px 0 6px}
.field{margin-bottom:10px}
.field label{display:block;font-size:14px;font-weight:600;color:#636A61;margin-bottom:4px}
.msg{font-size:15px;margin:8px 0}
.msg.bad{color:#A8520A}
body.dark .msg.bad{color:#F2A35E}
.hidden{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{display:inline-block;line-height:24px}
.tagbar{margin:10px 0 0}
.tchip{display:inline-block;margin:0 6px 6px 0;border:1px solid #D3D8CD;background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;color:inherit}
.tchip b{font-family:Menlo,monospace;font-size:12px;color:#636A61}
.tchip.on{background:#1A57AE;border-color:#1A57AE;color:#fff}
.tchip.on b{color:#fff}
body.dark .tchip{background:#1F2321;border-color:#2F3430}
body.dark .tchip.on{background:#86B6FF;border-color:#86B6FF;color:#0A1424}
.row .tg{display:block;margin-top:3px}
.row .tg i{font-style:normal;font-size:12px;color:#1A57AE;background:#E5E8E1;border-radius:999px;padding:1px 8px;margin-right:4px}
body.dark .row .tg i{color:#86B6FF;background:#232724}
.sheet .cur{background:#E5E8E1;border-radius:4px}
.sheet div.cur{color:#1A57AE;font-weight:bold}
body.dark .sheet .cur{background:#232724}
body.dark .sheet div.cur{color:#86B6FF}
.tt{min-width:84px}
.gpview{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:#F1F2EE;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
body.dark .gpview{background:#141615}
.gp-top,.gp-bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;padding:6px 12px}
.gp-top>*,.gp-bar>*{margin:3px 8px 3px 0}
.gp-title{font-weight:bold}
/* the score is drawn black on white in both themes, like printed music */
.gp-wrap{-webkit-flex:1;flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;background:#fff;color:#000}
.gp-msg{margin:0;padding:24px 16px;text-align:center;color:#555}
.gp-bar input[type=range]{width:160px;border:0;padding:0;background:none}
.gp-bar .btn.on{background:#1A57AE;border-color:#1A57AE;color:#fff}
body.gp-on{overflow:hidden}
body.gp-on .tools{display:none}
.at-cursor-bar{background:rgba(255,200,0,.22)}
.at-cursor-beat{background:rgba(26,87,174,.85);width:3px}
.at-highlight *{fill:#1A57AE;stroke:#1A57AE}
svg.dia{display:block;width:100%;height:auto}
.dia .fr{stroke:#CDD2C8;stroke-width:1.2}
.dia .st{stroke:#9AA196;stroke-width:1.4}
.dia .nut,.dia .dot{fill:#191B19}
.dia .open{fill:none;stroke:#191B19;stroke-width:1.8}
.dia .fg{fill:#fff;font:bold 12px Menlo,monospace}
.dia .mute{fill:#636A61;font:16px Menlo,monospace}
.dia .pos{fill:#636A61;font:bold 13px Menlo,monospace}
body.dark .dia .fr{stroke:#343A35}
body.dark .dia .st{stroke:#5E665F}
body.dark .dia .nut,body.dark .dia .dot{fill:#ECEEE9}
body.dark .dia .open{stroke:#ECEEE9}
body.dark .dia .fg{fill:#141615}
.chip .dia .fg{display:none}
.tab{color:#2a9d6e;font-weight:bold}
.sheet .rep{height:0;overflow:hidden}
.cmt{color:#8a8a8a;font-style:italic;font-weight:normal}
</style>
</head>
<body>
<div id="app"></div>
<div id="tools" class="tools hidden"></div>
<div id="ov" class="overlay hidden"></div>
<script>
(function(){
'use strict';

/* ---------- small helpers (Safari 9 lacks padEnd, closest, Object.entries) ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rep(ch,n){var s='';for(var i=0;i<n;i++)s+=ch;return s}
function padTo(s,n){return s.length>=n?s:s+rep(' ',n-s.length)}
function closestAct(el){while(el&&el!==document){if(el.getAttribute&&el.getAttribute('data-act'))return el;el=el.parentNode}return null}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function plural(n,a,b,c){var m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)}

/* ---------- chords ---------- */
var NS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var NFL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
function noteIndex(n){var i=BASE[n.charAt(0)];if(n.charAt(1)==='#')i++;else if(n.charAt(1)==='b')i--;return (i+12)%12}
var CHORD_RE=/^([A-H])([#b]?)([^\/\s]*)(?:\/([A-H][#b]?))?$/;
var QUAL_OK=/^(?:maj|min|m|M|dim|aug|sus|add|no|[0-9]|b|#|\+|°|ø|Δ|\(|\)|-|o)*$/;
function parseChord(t){
  var m=CHORD_RE.exec(t); if(!m||!QUAL_OK.test(m[3]))return null;
  return {txt:t,root:noteIndex(m[1]+m[2]),q:m[3],bass:m[4]?noteIndex(m[4]):null};
}
function chordTok(t){
  var c=parseChord(t); if(c)return {pre:'',c:c,post:''};
  var m=/^([(\[{*\/|<~.-]*)(.*?)([)\]}*\/|>~.,-]*)$/.exec(t);
  if(m&&(m[1]||m[3])&&m[2]){c=parseChord(m[2]);if(c)return {pre:m[1],c:c,post:m[3]}}
  return null;
}
function chordName(c,shift,flats){
  if(!shift)return c.txt;
  var N=flats?NFL:NS;
  return N[(c.root+shift+120)%12]+c.q+(c.bass!==null?'/'+N[(c.bass+shift+120)%12]:'');
}
var QMAP={'':'maj','M':'maj','maj':'maj','m':'m','min':'m','-':'m','7':'7','m7':'m7','min7':'m7','-7':'m7','maj7':'maj7','M7':'maj7','Δ':'maj7','Δ7':'maj7',
  'sus2':'sus2','2':'sus2','sus4':'sus4','sus':'sus4','4':'sus4','dim':'dim','°':'dim','o':'dim','dim7':'dim7','°7':'dim7','o7':'dim7','aug':'aug','+':'aug',
  '6':'6','m6':'m6','9':'9','add9':'add9','5':'5','7sus4':'7sus4','7sus':'7sus4','m7b5':'m7b5','ø':'m7b5','m7-5':'m7b5','ø7':'m7b5'};
function normQ(q){
  q=q.replace(/[()]/g,'');
  if(QMAP.hasOwnProperty(q))return {q:QMAP[q],approx:false};
  var r='maj';
  if(/^(maj|M|Δ)/.test(q))r='maj7';
  else if(/^(m|min|-)/.test(q))r=/\d/.test(q)?'m7':'m';
  else if(/^sus/.test(q))r='sus4';
  else if(/^(dim|°|o)/.test(q))r='dim';
  else if(/^(aug|\+)/.test(q))r='aug';
  else if(/^(7|9|11|13)/.test(q))r='7';
  return {q:r,approx:true};
}

/* ---------- shapes: the user's chart first, then common open chords, then movable shapes ---------- */
var OPEN_STR=[4,9,2,7,11,4];
function fretsOf(s){var p=s.indexOf(' ')>=0?s.split(' '):s.split('');var out=[];for(var i=0;i<p.length;i++)out.push(p[i]==='x'?-1:+p[i]);return out}
var CHART_ROWS=[
 'Ab=4 6 6 5 4 4@4|G#m=4 6 6 4 4 4@4|Ab6=4 3 1 1 1 1|Ab7=x x 1 1 1 2|Ab9=x x 1 3 1 2|G#m7=x x 1 1 0 2|Abmaj7=x x 1 1 1 3|G#dim=x x 0 1 0 1|Ab+=x x 2 1 1 0|Absus=x x 1 1 2 4',
 'A=x 0 2 2 2 0|Am=x 0 2 2 1 0|A6=x 0 2 2 2 2|A7=x 0 2 2 2 3|A9=x 0 2 4 2 3|Am6=x 0 2 2 1 2|Am7=x 0 2 2 1 3|Amaj7=x 0 2 1 2 0|Adim=x x 1 2 1 2|A+=x 0 3 2 2 1|Asus=x 0 2 2 3 0',
 'Bb=x 1 3 3 3 1|Bbm=x 1 3 3 2 1|Bb6=1 1 3 3 3 3|Bb7=x x 3 3 3 4@3|Bbm6=x x 3 3 2 3|Bbm7=x x 3 3 2 4|Bbmaj7=x 1 3 2 3 x|Bbdim=x x 2 3 2 3|Bb+=x x 0 3 3 2|Bbsus=x x 3 3 4 1',
 'B=x 2 4 4 4 2|Bm=x 2 4 4 3 2|B6=2 2 4 4 4 4|B7=x 2 1 2 0 2|B9=x 2 1 2 2 2|Bm6=x x 4 4 3 4|Bm7=x 2 4 2 3 2@2|Bmaj7=x 2 4 3 4 x|Bdim=x x 0 1 0 1|B+=x x 5 4 4 3@3|Bsus=x x 4 4 5 2@2',
 'C=x 3 2 0 1 0|Cm=x 3 5 5 4 3@3|C6=x x 2 2 1 3|C7=x 3 2 3 1 0|C9=x 3 2 3 3 3|Cm6=x x 1 2 1 3|Cm7=x x 1 3 1 3|Cmaj7=x 3 2 0 0 0|Cdim=x x 1 2 1 2|C+=x x 2 1 1 0|Csus=x x 3 0 1 3',
 'Db=x x 3 1 2 1|C#m=x x 2 1 2 0|Db6=x x 3 3 2 4|Db7=x x 3 4 2 4|Db9=x 4 3 4 4 4|C#m6=x x 2 3 2 4|C#m7=x x 2 4 2 4|Dbmaj7=x 4 3 1 1 1|C#dim=x x 2 3 2 3|Db+=x x 3 2 2 1',
 'D=x x 0 2 3 2|Dm=x x 0 2 3 1|D6=x 0 0 2 0 2|D7=x x 0 2 1 2|D9=2 0 0 2 1 0|Dm6=x x 0 2 0 1|Dm7=x x 0 2 1 1|Dmaj7=x x 0 2 2 2|Ddim=x x 0 1 0 1|D+=x x 0 3 3 2|Dsus=x x 0 2 3 3',
 'Eb=x x 5 3 4 3@3|Ebm=x x 4 3 4 2|Eb6=x x 1 3 1 3|Eb7=x x 1 3 2 3|Eb9=1 1 1 3 2 1|Ebm6=x x 1 3 1 2|Ebm7=x x 1 3 2 2|Ebmaj7=x x 1 3 3 3|Ebdim=x x 1 2 1 2|Eb+=x x 1 0 0 3|Ebsus=x x 1 3 4 4',
 'E=0 2 2 1 0 0|Em=0 2 2 0 0 0|E6=0 2 2 1 2 0|E7=0 2 2 1 3 0|E9=0 2 0 1 0 2|Em6=0 2 2 0 2 0|Em7=0 2 0 0 0 0|Emaj7=0 2 1 1 0 0|Edim=x x 2 3 2 3|E+=x x 2 1 1 0|Esus=0 2 2 2 0 0',
 'F=1 3 3 2 1 1|Fm=1 3 3 1 1 1|F6=x x 0 2 1 1|F7=1 3 1 2 1 1|F9=x x 3 2 4 3|Fm6=x x 0 1 1 1|Fm7=1 3 1 1 1 1|Fmaj7=x x 3 2 1 0|Fdim=x x 0 1 0 1|F+=x x 3 2 2 1|Fsus=x x 3 3 1 1',
 'F#=2 4 4 3 2 2|F#m=2 4 4 2 2 2|Gb6=x 4 4 3 4 x|F#7=x x 4 3 2 0|F#9=x x 4 3 5 4@3|F#m6=x x 1 2 2 2|F#m7=x x 2 2 2 2|Gbmaj7=x x 4 3 2 1|F#dim=x x 1 2 1 2|Gb+=x x 4 3 3 2|Gbsus=x x 4 4 2 2',
 'G=3 2 0 0 0 3|Gm=3 5 5 3 3 3@3|G6=3 2 0 0 0 0|G7=3 2 0 0 0 1|G9=3 0 0 2 0 1|Gm6=x x 2 3 3 3|Gm7=3 5 3 3 3 3@3|Gmaj7=x x 5 4 3 2@2|Gdim=x x 2 3 2 3|G+=x x 1 0 0 3|Gsus=x x 0 0 1 3'
];
var CQ={'':'maj','m':'m','6':'6','7':'7','9':'9','m6':'m6','m7':'m7','maj7':'maj7','dim':'dim','+':'aug','sus':'sus4'};
var CHART={};
(function(){
  for(var r=0;r<CHART_ROWS.length;r++){
    var cells=CHART_ROWS[r].split('|');
    for(var i=0;i<cells.length;i++){
      var kv=cells[i].split('='),name=kv[0],rest=kv[1].split('@');
      var m=/^([A-G][#b]?)(.*)$/.exec(name),root=noteIndex(m[1]),q=CQ[m[2]];
      var v={frets:fretsOf(rest[0]),base:rest[1]?+rest[1]:0};
      CHART[root+':'+q]=v; if(q==='dim')CHART[root+':dim7']=v;
    }
  }
})();
var OPEN_RAW={C7:'x32310',Cmaj7:'x32000',Cadd9:'x32030',Csus2:'x30013',Dsus2:'xx0230',Esus2:'024400',E7sus4:'020200',Eadd9:'024100',
  Fsus2:'xx3011',Gsus2:'300033',Gadd9:'320203',Asus2:'x02200',A5:'x022xx',E5:'022xxx',A7sus4:'x02030',Bm7:'x20202'};
var SLASH_RAW={'D/F#':'200232','C/G':'332010','G/B':'x20003','C/E':'032010','Am/G':'3x2210','G/F#':'2x0003','D/A':'x00232','C/B':'x22010','F/C':'x33211','Am/E':'002210'};
var OPEN={},SLASH={};
(function(){
  var k,c;
  for(k in OPEN_RAW){c=parseChord(k);OPEN[c.root+':'+normQ(c.q).q]=fretsOf(OPEN_RAW[k])}
  for(k in SLASH_RAW){c=parseChord(k);SLASH[c.root+':'+normQ(c.q).q+'/'+c.bass]=fretsOf(SLASH_RAW[k])}
})();
var N_=null;
var SHAPES={
  E:{note:4,s:{maj:[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,N_,1,1,0,N_],sus2:[0,2,4,4,0,0],sus4:[0,2,2,2,0,0],'7sus4':[0,2,0,2,0,0],
    '5':[0,2,2,N_,N_,N_],dim:[0,1,2,0,N_,N_],m7b5:[0,1,0,0,N_,N_],m6:[0,2,2,0,2,0],'6':[0,2,2,1,2,0],'9':[0,2,0,1,0,2],add9:[0,2,4,1,0,0],dim7:[0,1,2,0,2,0],aug:[0,3,2,1,1,0]}},
  A:{note:9,s:{maj:[N_,0,2,2,2,0],m:[N_,0,2,2,1,0],'7':[N_,0,2,0,2,0],m7:[N_,0,2,0,1,0],maj7:[N_,0,2,1,2,0],sus2:[N_,0,2,2,0,0],sus4:[N_,0,2,2,3,0],'6':[N_,0,2,2,2,2],
    m6:[N_,0,2,2,1,2],'9':[N_,0,-1,0,0,0],add9:[N_,0,2,4,2,0],'7sus4':[N_,0,2,0,3,0],m7b5:[N_,0,1,0,1,N_],dim:[N_,0,1,2,1,N_],'5':[N_,0,2,2,N_,N_],aug:[N_,0,3,2,2,N_],dim7:[N_,0,1,-1,1,N_]}},
  D:{note:2,s:{maj:[N_,N_,0,2,3,2],m:[N_,N_,0,2,3,1],'7':[N_,N_,0,2,1,2],m7:[N_,N_,0,2,1,1],maj7:[N_,N_,0,2,2,2],dim7:[N_,N_,0,1,0,1],aug:[N_,N_,0,3,3,2]}}
};
function shapeVoicing(root,q,key){
  var sh=SHAPES[key],off=sh.s[q]; if(!off)return null;
  var r=(root-sh.note+12)%12,f=[],i,neg=false;
  for(i=0;i<6;i++){f.push(off[i]===null?-1:r+off[i]);if(off[i]!==null&&r+off[i]<0)neg=true}
  if(neg){r+=12;f=[];for(i=0;i<6;i++)f.push(off[i]===null?-1:r+off[i])}
  if(Math.max.apply(null,f)>16)return null;
  return {frets:f,base:0,barre:key!=='D'&&r>0};
}
var CUSTOM={};
function setCustom(shapes){
  CUSTOM={};

function trkDownload(){
  var s=find(S.cur); if(!s||!s.track||!s.track.path)return;
  var c=ghCfg(); if(!c){renderMinus(s,'Подключите GitHub внизу списка песен.');return}
  var x=new XMLHttpRequest();
  x.open('GET','https://api.github.com/repos/'+c.repo+'/contents/'+s.track.path.split('/').map(encodeURIComponent).join('/')+'?ts='+Date.now());
  x.responseType='arraybuffer';
  x.setRequestHeader('Authorization','token '+c.token);
  x.setRequestHeader('Accept','application/vnd.github.v3.raw');
  x.onprogress=function(e){var p=$('m-prog');if(p)p.textContent='Скачиваю минус… '+(e.lengthComputable?Math.round(e.loaded*100/e.total)+'%':Math.round(e.loaded/1024)+' КБ')};
  x.onload=function(){
    if(x.status!==200){renderMinus(s,x.status===401?'GitHub не принял токен. Подключите GitHub заново внизу списка песен.':'Не удалось скачать минус (ошибка '+x.status+').');return}
    var ext=s.track.path.split('.').pop().toLowerCase();
    var type={m4a:'audio/mp4',mp3:'audio/mpeg',wav:'audio/wav',aac:'audio/aac',aif:'audio/aiff',aiff:'audio/aiff'}[ext]||'audio/mp4';
    var rec={buf:x.response,type:type,name:s.track.name,path:s.track.path,dur:s.track.dur};
    idbPut(s.id,rec,function(ok){
      if(S.cur!==s.id)return;
      trkStop(); TRK.id=s.id; TRK.marks=(s.marks&&s.marks.length?s.marks:[]).slice(); TRK.stale=false;

    });

function trkTime(){return TRK.el?TRK.el.currentTime:(TRK.v?(Date.now()-TRK.vStart)/1000:TRK.vPaused)}

  var t=trkTime(),d=TRK.el?(TRK.el.duration||0):vEnd();
  var tm=$('t-time'); if(tm)tm.textContent=fmt(t)+' / '+fmt(d);
  if(!TRK.el&&t>=d){vReset();return}

    var i=-1; for(var k=0;k<TRK.marks.length;k++)if(TRK.marks[k]!=null&&TRK.marks[k]<=t+0.05)i=k;

  else if(a==='chord')openChord(b.getAttribute('data-c'));
  else if(a==='close')ov.className='overlay hidden';
  else if(a==='dark'){S.dark=!S.dark;lsSet('ip.dark',S.dark?'1':'0');applyDark();renderList()}
  else if(a==='tr'){S.shift=((S.shift+(+b.getAttribute('data-d')))+18)%12-6;if(S.shift===-6)S.shift=6;S.tr[S.cur]=S.shift;lsSet('ip.tr',JSON.stringify(S.tr));fillSong();renderTools()}
  else if(a==='fs'){S.fs=Math.min(30,Math.max(12,S.fs+2*(+b.getAttribute('data-d'))));lsSet('ip.fs',S.fs);$('sheet').style.fontSize=S.fs+'px'}
  else if(a==='scroll'){if(S.scroll)stopScroll();else{S.scroll=true;lastT=0;acc=0;raf=requestAnimationFrame(tick)}renderTools()}
  else if(a==='pull'){$('msg').className='msg';$('msg').textContent='Обновляю…';pull(function(err){renderList(err)})}
  else if(a==='gh-on'){
    var repo=$('gh-repo').value.replace(/^\s+|\s+$/g,'').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''),token=$('gh-token').value.replace(/\s/g,'');
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){$('msg').className='msg bad';$('msg').textContent='Впишите репозиторий в виде имя/репозиторий и вставьте токен.';window.scrollTo(0,0);return}
    lsSet('ip.gh',JSON.stringify({repo:repo,token:token}));
    pull(function(err){if(err)lsSet('ip.gh','null');renderList(err);window.scrollTo(0,0)});
  }
  else if(a==='gh-off'){lsSet('ip.gh','null');renderList()}
  else if(a==='paste'){
    var raw=$('paste').value;
    try{useData(JSON.parse(raw),raw);renderList();window.scrollTo(0,0)}
    catch(err){$('msg').className='msg bad';$('msg').textContent='Это не похоже на резервную копию песенника. Скопируйте файл целиком.';window.scrollTo(0,0)}
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='m-file'&&e.target.files&&e.target.files[0]){trkAdd(e.target.files[0]);e.target.value=''}
  if(e.target.id==='gp-track'&&GP.api&&GP.api.score){var tr=GP.api.score.tracks[+e.target.value];if(tr)GP.api.renderTracks([tr])}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;fillList()}
  else if(e.target.id==='speed'){S.speed=+e.target.value;lsSet('ip.speed',S.speed)}
  else if(e.target.id==='gp-speed'){var v=+e.target.value;if(GP.api)GP.api.playbackSpeed=v/100;var l=$('gp-speed-l');if(l)l.textContent=v+'%'}
});
/* AppCache: switch to a freshly downloaded version on the next launch without asking */
try{if(window.applicationCache)window.applicationCache.addEventListener('updateready',function(){try{window.applicationCache.swapCache()}catch(e){}})}catch(e){}

applyDark();
loadCache();
renderList();
if(ghCfg()&&navigator.onLine!==false)pull(function(err){if(!S.cur)renderList(err==='CERT'||!S.songs.length?err:'')});
})();
</script>
</body>
</html>

/* ---------- send a minus to the iPad through the GitHub repository: only for songs where it is asked for ---------- */
async function ghDeletePath(path){
  if(!ghOn()||!path)return;
  try{const sha=await ghFileSha(path);if(sha)await ghFetch('/contents/'+encPath(path),{method:'DELETE',body:JSON.stringify({message:'Песенник: минус убран с GitHub',sha})})}catch{}
}
async function trackSend(id){
  const s=findSong(id),rec=await trackGet(id); if(!s||!s.track||!rec||!ghOn())return;
  if((rec.size||0)>95*1024*1024){toast('Минус больше 95 МБ: GitHub такие файлы не принимает.');return}
  closeSheet(); toast('Отправляю минус на GitHub…');
  try{
    const buf=rec.buf||await rec.blob.arrayBuffer();
    const ext=((rec.name||s.track.name||'').split('.').pop()||'m4a').toLowerCase().replace(/[^a-z0-9]/g,'')||'m4a';
    const path='tracks/'+gtpSlug(s)+'.'+ext,old=s.track.path,sha=await ghFileSha(path);
    await ghFetch('/contents/'+encPath(path),{method:'PUT',body:JSON.stringify({message:'Песенник: минус «'+(s.title||'')+'» для iPad',content:bufToB64(buf),...(sha?{sha}:{})})});
    const cur=findSong(id); if(cur&&cur.track)await store.patch(id,{track:{...cur.track,path},updatedAt:Date.now()});
    if(old&&old!==path)ghDeletePath(old);
    toast('Минус отправлен. На iPad откройте эту песню и нажмите «Скачать минус».');
  }catch(e){toast('Не удалось отправить минус: '+ghErrText(e))}
}
async function trackUnsend(){
  const s=findSong(S.cur); if(!s||!s.track||!s.track.path)return;
  closeSheet(); await ghDeletePath(s.track.path);
  const {path,...rest}=s.track;
  try{await store.patch(s.id,{track:rest,updatedAt:Date.now()});toast('Минус убран с GitHub')}catch(e){saveErr(e)}
}

/* ---------- tags ---------- */
const DEFAULT_TAGS=['костёр','медленные','разучиваю'];
const ED={tags:[]};
function tagCounts(){const m=new Map();S.songs.forEach(s=>(s.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));return m}
function fillTagbar(){
  const el=document.getElementById('tagbar'); if(!el)return;
  const m=tagCounts(); if(S.tag&&!m.has(S.tag))S.tag=null;
  if(!m.size){el.innerHTML='';return}
  const tags=[...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ru'));
  el.innerHTML=`<button class="tchip" data-act="tag" data-t="" aria-pressed="${!S.tag}">Все</button>`+
    tags.map(([t,n])=>`<button class="tchip" data-act="tag" data-t="${esc(t)}" aria-pressed="${S.tag===t}">${esc(t)}<b>${n}</b></button>`).join('');
}
function fillTagpick(){
  const el=document.getElementById('tagpick'); if(!el)return;
  const all=[...new Set([...DEFAULT_TAGS,...tagCounts().keys(),...ED.tags])];
  el.innerHTML=all.map(t=>`<button type="button" class="tchip" data-act="tag-toggle" data-t="${esc(t)}" aria-pressed="${ED.tags.includes(t)}">${esc(t)}</button>`).join('');
}
function addTag(){
  const inp=document.getElementById('f-tag'),t=(inp.value||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!t)return; if(!ED.tags.includes(t))ED.tags.push(t); inp.value=''; fillTagpick();
}
const TAB_LINE=/^\s*[A-Ga-g]?#?\s*\|?[-0-9|hpbrxX\/\\~()\s]{6,}\|?\s*$/;

/* ---------- stage mode ---------- */
let stageWake=null;
async function enterStage(){
  if(S.view!=='song')return;
  S.stage=true; document.body.classList.add('stage');
  document.getElementById('body').style.setProperty('--fs',S.sfs+'px');
  renderTools(); SCR.scrollTo(0,0);
  try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'})}catch{}
  try{stageWake=await navigator.wakeLock.request('screen')}catch{stageWake=null}
}
function exitStage(){
  if(!S.stage)return;
  S.stage=false; document.body.classList.remove('stage');
  if(stageWake){stageWake.release().catch(()=>{});stageWake=null}
  try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
  const b=document.getElementById('body'); if(b)b.style.setProperty('--fs',S.fs+'px');
  if(S.view==='song')renderTools();
}

/* freeze the visible screen into a snapshot; the new screen then slides in from the right ('fwd')
   or the snapshot slides away to the right, uncovering the list ('back') */
function pageTurn(dir){
  try{
    const y=SCR.scrollTop,snap=document.createElement('div'),view=document.createElement('div'),inner=app.cloneNode(true);
    snap.className='pslide'; view.className='pt-view'; inner.removeAttribute('id'); inner.className='';
    inner.querySelectorAll('[id]:not(linearGradient):not(radialGradient)').forEach(e=>e.removeAttribute('id'));
    view.appendChild(inner);
    const shade=document.createElement('div'); shade.className='pt-shade';
    snap.appendChild(view); snap.appendChild(shade); document.body.appendChild(snap);
    view.scrollTop=y;
    snap.getBoundingClientRect();
    snap.classList.add(dir);
    const cls=dir==='fwd'?'slide-in':'slide-under';
    app.classList.remove('slide-in','slide-under'); void app.offsetWidth; app.classList.add(cls);
    let gone=false; const done=()=>{if(!gone){gone=true;snap.remove();app.classList.remove(cls)}};
    app.addEventListener('animationend',function h(e){if(e.target===app){app.removeEventListener('animationend',h);done()}});
    setTimeout(done,700);
  }catch{}
}

function fretsText(f){return f.map(x=>x<0?'x':x).join(' ')}
function parseFretsText(t){
  const s=t.trim().toLowerCase().replace(/[хx×]/g,'x');
  const parts=/[\s,\-]/.test(s)?s.split(/[\s,\-]+/).filter(Boolean):[...s];
  if(parts.length!==6)return null;
  const f=parts.map(p=>p==='x'?-1:/^\d{1,2}$/.test(p)?+p:NaN);
  return f.some(x=>Number.isNaN(x)||x>22)?null:f;
}
function fillShapeEditor(){
  if(!SE)return;

  document.getElementById('se-base-l').textContent=b===1?'От порожка':`С ${b}-го лада`;
  let h='';
  for(let i=0;i<6;i++)h+=`<button class="top" data-act="se-top" data-s="${i}" aria-label="Струна ${6-i}: ${f[i]<0?'не играть':f[i]===0?'открытая':'зажата'}">${f[i]<0?'×':f[i]===0?'○':''}</button>`;
  for(let r=0;r<5;r++)for(let i=0;i<6;i++){const fr=b+r;
    h+=`<button class="fret${f[i]===fr?' on':''}${r===0&&b===1?' first':''}" data-act="se-fret" data-s="${i}" data-f="${fr}" aria-label="Струна ${6-i}, ${fr} лад"></button>`}
  document.getElementById('board').innerHTML=h;
  const ft=document.getElementById('se-frets'); if(document.activeElement!==ft)ft.value=fretsText(f);
  const p=f.filter(x=>x>0),v={frets:f,base:b>1?b:(p.length&&Math.max(...p)>4?Math.min(...p):0),barre:autoBarre(f)};
  document.getElementById('se-prev').innerHTML=diagram(v);

  const c=name?parseChord(name):null,ck=c?checkShape(name,f):null;
  document.getElementById('se-verdict').innerHTML=!name?'':!c?'<p class="verdict bad">Не понимаю название аккорда. Пишите латиницей, например Am, F#m7, Bbmaj7, D/F#.</p>'
    :ck.unknown?'<p class="verdict">Для такого типа аккорда проверить ноты не могу, но схему сохранить можно.</p>'
    :ck.ok?'<p class="verdict ok">Ноты совпадают с названием аккорда.</p>'

}

(()=>{

  },{passive:true});

  },{passive:true});

/* ---------- count-in: one bar of clicks before the minus or the autoscroll starts ---------- */
const CI={on:false,timers:[],el:null};
function countInOn(){return lsGet('sb.countin')!=='0'}
function countInStop(){CI.on=false;CI.timers.forEach(clearTimeout);CI.timers=[];if(CI.el){CI.el.remove();CI.el=null}}
function countIn(go){
  if(!countInOn()||M.on){go();return}
  countInStop();
  const ctx=audioCtx(),n=M.beats,spb=60/M.bpm;
  unlockAudio(n*spb+2);
  const ov=document.createElement('div'); ov.className='countin'; ov.setAttribute('role','status');
  ov.innerHTML='<b></b><span>Отсчёт · нажмите, чтобы отменить</span>';
  ov.addEventListener('click',e=>{e.stopPropagation();countInStop();renderTools()});
  document.body.appendChild(ov); CI.el=ov; CI.on=true;
  whenRunning(ctx,()=>{
    if(!CI.on)return;
    const t0=ctx.currentTime+0.1,lead=100;
    for(let k=0;k<n;k++){
      metroClick(t0+k*spb,k===0);
      CI.timers.push(setTimeout(()=>{const b=ov.querySelector('b');b.textContent=k+1;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')},lead+k*spb*1000));
    }
    CI.timers.push(setTimeout(()=>{countInStop();go()},lead+n*spb*1000));
  });
}

/* ---------- autoscroll ---------- */
let raf=0,lastT=null,acc=0,wake=null;
function tick(t){
  if(!S.scroll.on)return;
  if(lastT!=null){acc+=S.scroll.speed*(t-lastT)/1000;if(acc>=1){const n=Math.floor(acc);acc-=n;SCR.scrollBy(0,n)}
    if(SCR.clientHeight+SCR.scrollTop>=SCR.scrollHeight-2){stopAuto();renderTools();return}}
  lastT=t;raf=requestAnimationFrame(tick);
}
async function startScroll(){S.scroll.on=true;lastT=null;acc=0;raf=requestAnimationFrame(tick);
  try{wake=await navigator.wakeLock.request('screen')}catch{wake=null}}

/* ---------- sync with a GitHub repository (home-screen app only: claude.ai pages cannot reach other sites) ---------- */
let RAW=null;
const GH={cfg:(()=>{try{return JSON.parse(lsGet('sb.gh')||'null')}catch{return null}})(),busy:false,timer:0,msg:'',err:false,pub:false,sureOff:false};
const DEL=(()=>{try{return JSON.parse(lsGet('sb.deleted')||'{}')||{}}catch{return {}}})(); // id or "shape:Name" → when it was deleted
function saveDel(){lsSet('sb.deleted',JSON.stringify(DEL))}
const ghCan=()=>!!window.SONGBOOK_OFFLINE;
const ghOn=()=>ghCan()&&!!(GH.cfg&&GH.cfg.repo&&GH.cfg.token);
function wrapStore(st){
  return {
    subscribe:st.subscribe,
    async save(s){await st.save(s);ghSoon()},
    async patch(id,p){await st.patch(id,p);ghSoon()},
    async remove(id){DEL[id]=Date.now();saveDel();await st.remove(id);ghSoon()}
  };
}
function ghSoon(){if(!ghOn())return;clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghSync(),3500)}
function b64encUtf8(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64decUtf8(b64){const bin=atob(b64.replace(/\s/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
async function ghFetch(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+GH.cfg.repo+path,{cache:'no-store',...opt,
    headers:{Authorization:'Bearer '+GH.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('github '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function ghGetFile(){try{return await ghFetch('/contents/songbook.json?ts='+Date.now())}catch(e){if(e.status===404)return null;throw e}}
/* Newest edit of each song wins; a deletion wins over any edit made before it */
function mergeData(local,remote){
  const del={...((remote&&remote.deleted)||{})};
  for(const [k,v] of Object.entries(DEL))if(!(del[k]>=v))del[k]=v;
  const map=new Map();
  for(const s of (remote&&remote.songs)||[])if(s&&s.id)map.set(s.id,s);
  for(const s of local.songs){
    const o=map.get(s.id); if(!o){map.set(s.id,s);continue}
    let w=(s.updatedAt||0)>=(o.updatedAt||0)?s:o; const l=w===s?o:s;
    if((l.marksAt||0)>(w.marksAt||0))w={...w,marks:l.marks,wmarks:l.wmarks,marksAt:l.marksAt};
    map.set(s.id,w);
  }
  const songs=[...map.values()].filter(s=>!(del[s.id]>=(s.updatedAt||0))).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const shapes={};
  for(const src of [(remote&&remote.shapes)||{},local.shapes])for(const [n,v] of Object.entries(src))
    if(!shapes[n]||(v.t||0)>=(shapes[n].t||0))shapes[n]=v;
  for(const n of Object.keys(shapes))if(del['shape:'+n]>=(shapes[n].t||0))delete shapes[n];
  return {app:'songbook',version:1,songs,shapes,deleted:del};
}
async function applyMerged(m){
  Object.assign(DEL,m.deleted); saveDel();
  const local=new Map(S.songs.map(s=>[s.id,s]));
  for(const s of m.songs){const o=local.get(s.id);if(!o||JSON.stringify(o)!==JSON.stringify(s))await RAW.save({...s})}
  const keep=new Set(m.songs.map(s=>s.id));
  for(const s of S.songs.slice())if(!keep.has(s.id))await RAW.remove(s.id);
  if(JSON.stringify(m.shapes)!==JSON.stringify(S.shapes))await RAW.save({id:'_shapes',shapes:m.shapes});
}
const canon=d=>JSON.stringify({songs:d.songs,shapes:d.shapes,deleted:d.deleted});
async function ghSync(report){
  if(!ghOn()||GH.busy)return;
  if(!navigator.onLine){ghStatus('Нет интернета. Синхронизирую, когда он появится.',false);return}
  GH.busy=true; ghStatus('Синхронизирую…',false);
  try{
    for(let attempt=0;attempt<3;attempt++){
      const file=await ghGetFile();
      const remote=file?JSON.parse(b64decUtf8(file.content)):null;
      const merged=mergeData({songs:S.songs,shapes:S.shapes},remote);
      await applyMerged(merged);
      if(remote&&canon(remote)===canon(merged))break;
      const out={...merged,exportedAt:new Date().toISOString()};
      try{await ghFetch('/contents/songbook.json',{method:'PUT',body:JSON.stringify({message:'Песенник: синхронизация',content:b64encUtf8(JSON.stringify(out,null,1)),...(file?{sha:file.sha}:{})})});break}
      catch(e){if((e.status===409||e.status===422)&&attempt<2)continue;throw e}  // changed on another device meanwhile: merge again
    }
    GH.cfg.last=Date.now(); lsSet('sb.gh',JSON.stringify(GH.cfg)); ghStatus('',false);
    setTimeout(gtpPending,0);
    if(report){const n=S.songs.length,m=S.songs.filter(x=>Array.isArray(x.marks)&&x.marks.some(v=>v!=null)).length;
      toast('Синхронизировано с GitHub: '+n+' '+plural(n,'песня','песни','песен')+(m?', с разметкой: '+m:''))}
  }catch(e){ghStatus(ghErrText(e),true)}
  finally{GH.busy=false;fillSync()}
}
function ghErrText(e){
  if(e.status===401)return 'GitHub не принял токен: он неверный или истёк. Отключите синхронизацию и подключите заново с новым токеном.';
  if(e.status===403)return 'У токена нет права записи. При создании токена выберите для этого репозитория Contents: Read and write.';
  if(e.status===404)return 'Репозиторий не найден. Проверьте название (имя/репозиторий) и что токену дан доступ к нему.';
  return 'Не удалось связаться с GitHub. Попробую ещё раз позже.';
}
function ghStatus(t,err){GH.msg=t;GH.err=!!err;const el=document.getElementById('gh-msg');if(el){el.textContent=t;el.className='gh-msg'+(err?' bad':'')}}
async function ghConnect(){
  const repo=(document.getElementById('gh-repo').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const token=(document.getElementById('gh-token').value||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ghStatus('Введите репозиторий в виде имя/репозиторий, например ivan/my-songs.',true);return}
  if(!token){ghStatus('Вставьте токен GitHub.',true);return}
  GH.cfg={repo,token}; ghStatus('Проверяю доступ…',false);
  try{const info=await ghFetch('');GH.pub=!info.private}
  catch(e){GH.cfg=null;ghStatus(ghErrText(e),true);return}
  lsSet('sb.gh',JSON.stringify(GH.cfg)); fillSync(); ghSync();
}
function ghOff(btn){
  if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent='Точно отключить?';return}
  GH.cfg=null; lsSet('sb.gh','null'); ghStatus('',false); fillSync();
}
function fillSync(){
  const el=document.getElementById('sync'); if(!el)return;
  const h='<h3 class="sec-h">Синхронизация с GitHub</h3>';
  if(!ghCan()){el.innerHTML=h+`<p class="sec-p">Работает в приложении с экрана «Домой» (<a href="${OFFLINE_URL}" target="_blank" rel="noopener">${OFFLINE_URL.replace('https://','')}</a>): там песни сами сохраняются в ваш репозиторий на GitHub.</p>`;return}
  if(!ghOn()){
    el.innerHTML=h+`<p class="sec-p">Песни будут сами сохраняться в файл songbook.json в вашем репозитории и подтягиваться оттуда на других устройствах.</p>
      <ol class="steps">
        <li>На github.com создайте <b>приватный</b> репозиторий, например <b>songbook-data</b>.</li>
        <li>Создайте токен: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Settings → Developer settings → Fine-grained tokens</a>. В «Repository access» выберите только этот репозиторий, в «Permissions» → <b>Contents: Read and write</b>.</li>
        <li>Впишите репозиторий в виде <b>имя/репозиторий</b>, вставьте токен и нажмите «Подключить». Это нужно сделать один раз на каждом устройстве: подключение запоминается, токен хранится только в этом телефоне.</li>
      </ol>
      <div class="form gh-form">
        <div class="field"><label for="gh-repo">Репозиторий</label><input id="gh-repo" placeholder="имя/репозиторий" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label for="gh-token">Токен</label><input id="gh-token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="actions" style="justify-content:flex-start;margin-top:0"><button class="btn primary" data-act="gh-connect">Подключить</button></div>
      </div>
      <p id="gh-msg" class="gh-msg${GH.err?' bad':''}">${esc(GH.msg)}</p>`;
    return;
  }
  const last=GH.cfg.last?new Date(GH.cfg.last):null;
  el.innerHTML=h+`<p class="sec-p">Подключено к <b>${esc(GH.cfg.repo)}</b>, файл songbook.json.
      ${last?`Последняя синхронизация: ${last.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}, ${last.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}.`:''}</p>
    ${GH.pub?'<p class="gh-msg bad">Репозиторий открытый: ваши песни сможет прочитать кто угодно. Лучше сделать его приватным в настройках репозитория на GitHub.</p>':''}
    <div class="actions" style="justify-content:flex-start;margin-top:0">
      <button class="btn primary" data-act="gh-sync"${GH.busy?' disabled':''}>Синхронизировать сейчас</button>
      <button class="btn danger" data-act="gh-off">Отключить</button>
    </div>
    <p id="gh-msg" class="gh-msg${GH.err?' bad':''}">${esc(GH.msg)}</p>`;
}
function ghStart(){
  if(!ghOn())return;
  ghSync();
  addEventListener('online',()=>ghSync());
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(GH.cfg&&GH.cfg.last||0)>60000)ghSync()});
}

/* ---------- boot ---------- */
/* pinch in a song changes the text size, like the A/A buttons (the page itself never zooms) */
(()=>{
  let d0=0,f0=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  document.addEventListener('touchstart',e=>{if(S.view==='song'&&e.touches.length===2){d0=dist(e.touches);f0=S.stage?S.sfs:S.fs}},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!d0||e.touches.length!==2)return;
    const lo=S.stage?14:12,hi=S.stage?44:26,v=Math.round(Math.min(hi,Math.max(lo,f0*dist(e.touches)/d0)));
    if(S.stage)S.sfs=v;else S.fs=v;
    const b=document.getElementById('body'); if(b)b.style.setProperty('--fs',v+'px');
  },{passive:true});
  document.addEventListener('touchend',e=>{if(d0&&e.touches.length<2){d0=0;if(S.stage)lsSet('sb.sfs',S.sfs);else lsSet('sb.fs',S.fs)}},{passive:true});
})();
setTimeout(()=>{if(window.SONGBOOK_OFFLINE)guitarSamples()},4000);
if(lsGet('sb.skin.mid')!=='1'){lsSet('sb.skin','midnight');lsSet('sb.skin.mid','1')}
applySkin(lsGet('sb.skin')||'midnight');
renderList();
initStore().then(st=>{
  RAW=st; store=wrapStore(st);
  st.subscribe(list=>{
    const prev=S.cur?findSong(S.cur):null;
    S.songs=list.filter(s=>!String(s.id).startsWith('_'));
    S.checks=(list.find(s=>s.id==='_checks')||{}).checked||{};
    const shapes=(list.find(s=>s.id==='_shapes')||{}).shapes||{};
    const shapesChanged=JSON.stringify(shapes)!==JSON.stringify(S.shapes);
    if(shapesChanged){S.shapes=shapes;setShapes(shapes)}
    S.loaded=true;
    if(S.view==='list')fillList();
    else if(S.view==='chart')fillChart();
    else if(S.view==='song'&&shapesChanged&&findSong(S.cur))fillSong();
    else if(S.view==='song'){const now=findSong(S.cur);
      if(!now){S.cur=null;renderList()}
      else if(!prev||prev.body!==now.body||prev.title!==now.title||prev.artist!==now.artist||prev.capo!==now.capo)renderSong(S.cur,true)}
  });
  ghStart();
});

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Песенник">
<meta name="theme-color" content="#F1F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.SONGBOOK_OFFLINE=true</script>

<body><title>Мой песенник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  /* Layout: one-column phone songbook. Sticky header, monospaced chord sheet, toolbar in thumb reach at the bottom. */
  --bg:#F1F2EE; --surface:#FFFFFF; --sunk:#E5E8E1; --fg:#191B19; --muted:#636A61; --line:#D3D8CD;
  --chord:#1A57AE; --accent:#1A57AE; --on-accent:#FFFFFF; --danger:#B3261E; --bar:rgba(241,242,238,.94); --grid:#CDD2C8; --string:#9AA196; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#2D7A3E; --good-bg:#E2F1E5; --shadow:rgba(0,0,0,.1); --scrim:rgba(10,12,10,.38);
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111312; --surface:#1A1D1B; --sunk:#232724; --fg:#ECEEE9; --muted:#9BA298; --line:#2F3430;
    --chord:#86B6FF; --accent:#86B6FF; --on-accent:#0A1424; --danger:#FF8A80; --bar:rgba(17,19,18,.94); --grid:#343A35; --string:#5E665F; --warn:#F2A35E; --warn-bg:#33251A; --good:#7DD08E; --good-bg:#1C2E20; --shadow:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#1A1D1B; --sunk:#232724; --fg:#ECEEE9; --muted:#9BA298; --line:#2F3430;
  --chord:#86B6FF; --accent:#86B6FF; --on-accent:#0A1424; --danger:#FF8A80; --bar:rgba(17,19,18,.94); --grid:#343A35; --string:#5E665F; --warn:#F2A35E; --warn-bg:#33251A; --good:#7DD08E; --good-bg:#1C2E20; --shadow:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
/* Chosen skins override the automatic light/dark palette */
:root[data-skin="midnight"]{
  --bg:#000000; --surface:#0E0E10; --sunk:#1B1B1F; --fg:#F2EFE9; --muted:#9A968E; --line:#27272C;
  --chord:#FFB648; --accent:#FFB648; --on-accent:#1A1100; --danger:#FF7A6E; --bar:rgba(0,0,0,.9); --scrim:rgba(0,0,0,.65);
  --grid:#2A2A30; --string:#5C5C64; --warn:#FF9F5A; --warn-bg:#2A1A0C; --good:#7DD08E; --good-bg:#12241A; --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-skin="ocean"]{
  --bg:#0B1622; --surface:#112233; --sunk:#182C41; --fg:#E6F1FA; --muted:#8FA6BA; --line:#223B53;
  --chord:#5EE0D0; --accent:#5EE0D0; --on-accent:#04201D; --danger:#FF8A80; --bar:rgba(11,22,34,.92); --scrim:rgba(2,8,14,.6);
  --grid:#25415B; --string:#4F6E89; --warn:#F7B267; --warn-bg:#2E2416; --good:#7FE3A6; --good-bg:#12302A; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-skin="lavender"]{
  --bg:#F4F2FA; --surface:#FFFFFF; --sunk:#E9E5F5; --fg:#1E1A2E; --muted:#6B6585; --line:#DAD4EC;
  --chord:#6A3FD0; --accent:#6A3FD0; --on-accent:#FFFFFF; --danger:#B3261E; --bar:rgba(244,242,250,.92); --scrim:rgba(20,14,40,.35);
  --grid:#D3CCE8; --string:#9C94B8; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#2D7A3E; --good-bg:#E2F1E5; --shadow:rgba(40,20,90,.12);
  color-scheme:light;
}
:root[data-skin="mint"]{
  --bg:#EEF6F2; --surface:#FFFFFF; --sunk:#DDEDE6; --fg:#14231D; --muted:#5B7068; --line:#CFE2DA;
  --chord:#0E7A64; --accent:#0E7A64; --on-accent:#FFFFFF; --danger:#B3261E; --bar:rgba(238,246,242,.92); --scrim:rgba(8,30,22,.35);
  --grid:#C6DCD3; --string:#8FA89E; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#1F7A3A; --good-bg:#DDF2E3; --shadow:rgba(10,60,40,.12);
  color-scheme:light;
}
:root[data-skin="neon"]{
  --bg:#0F0B1A; --surface:#18122A; --sunk:#221A3A; --fg:#F1EAFF; --muted:#A497C2; --line:#2E2548;
  --chord:#FF6AD5; --accent:#FF6AD5; --on-accent:#2A0420; --danger:#FF8A80; --bar:rgba(15,11,26,.9); --scrim:rgba(5,2,12,.65);
  --grid:#2F2650; --string:#5E5285; --warn:#FFB86B; --warn-bg:#2E2014; --good:#7DF0B0; --good-bg:#13291F; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-skin="sakura"]{
  --bg:#FFF2F6; --surface:#FFFFFF; --sunk:#FBE3EB; --fg:#2B1520; --muted:#7D5B69; --line:#F2D3DF;
  --chord:#B8195A; --accent:#B8195A; --on-accent:#FFFFFF; --danger:#A3201A; --bar:rgba(255,242,246,.92); --scrim:rgba(40,8,22,.35);
  --grid:#EDCBD8; --string:#BE97A7; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#2D7A3E; --good-bg:#E2F1E5; --shadow:rgba(110,20,60,.12);
  color-scheme:light;
}
:root[data-skin="graphite"]{
  --bg:#17181B; --surface:#202226; --sunk:#2A2D32; --fg:#ECEDEF; --muted:#9A9EA6; --line:#33363C;
  --chord:#FF8A3D; --accent:#FF8A3D; --on-accent:#261100; --danger:#FF8A80; --bar:rgba(23,24,27,.92); --scrim:rgba(0,0,0,.6);
  --grid:#383C42; --string:#62666E; --warn:#FFB86B; --warn-bg:#2E2216; --good:#7DD08E; --good-bg:#15281B; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
/* "Сияние светлое": the same glow-and-glass look on a light ground, with a black primary button */
:root[data-skin="glowlight"]{
  --bg:#F6F7FB; --surface:rgba(255,255,255,.62); --sunk:rgba(15,23,42,.055); --fg:#0B0B12; --muted:#52525B; --line:rgba(15,23,42,.1);
  --chord:#1D4ED8; --accent:#2563EB; --on-accent:#FFFFFF; --danger:#DC2626; --bar:rgba(246,247,251,.66); --scrim:rgba(15,15,30,.35);
  --grid:rgba(15,23,42,.14); --string:rgba(15,23,42,.35); --warn:#B45309; --warn-bg:rgba(245,158,11,.14); --good:#15803D; --good-bg:rgba(34,197,94,.14); --shadow:rgba(30,41,90,.12);
  --f-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-skin="glowlight"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 0% 0%,rgba(59,130,246,.24),transparent 70%),radial-gradient(55% 45% at 100% 100%,rgba(168,85,247,.22),transparent 70%)}
:root[data-skin="glowlight"] body{isolation:isolate}
:root[data-skin="glowlight"] .brand,:root[data-skin="glowlight"] h1,:root[data-skin="glowlight"] .song-head h1,:root[data-skin="glowlight"] .cof-head h2,:root[data-skin="glowlight"] .sc-head h2{font-weight:900;letter-spacing:-.025em}
:root[data-skin="glowlight"] .btn,:root[data-skin="glowlight"] input,:root[data-skin="glowlight"] select,:root[data-skin="glowlight"] textarea{border-radius:14px}
:root[data-skin="glowlight"] .btn{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glowlight"] .btn.primary{background:#0B0B12;color:#FFFFFF;border-color:transparent;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:13px;box-shadow:0 12px 24px -10px rgba(15,23,42,.35)}
:root[data-skin="glowlight"] input:focus,:root[data-skin="glowlight"] textarea:focus,:root[data-skin="glowlight"] select:focus{outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.45)}
:root[data-skin="glowlight"] .panel{background:rgba(255,255,255,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(15,23,42,.08);border-bottom:0}
:root[data-skin="glowlight"] .chip,:root[data-skin="glowlight"] .tabs,:root[data-skin="glowlight"] .grp,:root[data-skin="glowlight"] .seg{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glowlight"] .dia .fg{fill:#FFFFFF}
:root[data-skin="glowlight"] .t-strings span.on,:root[data-skin="glowlight"] .cell .badge,:root[data-skin="glowlight"] .cell .tick{color:#FFFFFF}

/* "Сияние": the user's Songbook Pro login look — near-black ground, blue and violet glows, glass surfaces, white primary button */
:root[data-skin="glow"]{
  --bg:#0A0A0D; --surface:rgba(255,255,255,.055); --sunk:rgba(255,255,255,.085); --fg:#FFFFFF; --muted:#A1A1AA; --line:rgba(255,255,255,.1);
  --chord:#93C5FD; --accent:#60A5FA; --on-accent:#0A0F1F; --danger:#F87171; --bar:rgba(10,10,13,.62); --scrim:rgba(0,0,0,.6);
  --grid:rgba(255,255,255,.12); --string:rgba(255,255,255,.3); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12); --good:#4ADE80; --good-bg:rgba(74,222,128,.12); --shadow:rgba(0,0,0,.5);
  --f-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-skin="glow"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 0% 0%,rgba(37,99,235,.38),transparent 70%),radial-gradient(55% 45% at 100% 100%,rgba(147,51,234,.34),transparent 70%)}
:root[data-skin="glow"] body{isolation:isolate}
:root[data-skin="glow"] .brand,:root[data-skin="glow"] h1,:root[data-skin="glow"] .song-head h1,:root[data-skin="glow"] .cof-head h2,:root[data-skin="glow"] .sc-head h2{font-weight:900;letter-spacing:-.025em}
:root[data-skin="glow"] .btn,:root[data-skin="glow"] input,:root[data-skin="glow"] select,:root[data-skin="glow"] textarea{border-radius:14px}
:root[data-skin="glow"] .btn{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glow"] .btn.primary{background:#FFFFFF;color:#000000;border-color:transparent;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:13px;box-shadow:0 12px 24px -8px rgba(255,255,255,.12)}
:root[data-skin="glow"] input:focus,:root[data-skin="glow"] textarea:focus,:root[data-skin="glow"] select:focus{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,.5)}
:root[data-skin="glow"] .panel{background:rgba(22,22,28,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);border-bottom:0}
:root[data-skin="glow"] .chip,:root[data-skin="glow"] .tabs,:root[data-skin="glow"] .grp,:root[data-skin="glow"] .seg{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glow"] .tabs button[aria-pressed="true"],:root[data-skin="glow"] .tabs button[aria-selected="true"]{background:rgba(255,255,255,.14)}
/* text that sits on solid light marks needs a dark ink here, not the see-through surface */
:root[data-skin="glow"] .dia .fg{fill:#0A0A0D}
:root[data-skin="glow"] .t-strings span.on,:root[data-skin="glow"] .cell .badge,:root[data-skin="glow"] .cell .tick{color:#0A0A0D}

body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
body.has-tools .wrap{padding-block-end:120px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;min-height:60px}
.bar-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}

.btn{font:500 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 13px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.icon{width:40px;padding:0}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

input,select,textarea{font:16px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{font-family:var(--f-mono);font-size:16px;line-height:1.4;min-height:50vh;resize:vertical;white-space:pre;overflow-x:auto}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* Library */
.search{margin-block:4px 8px}
.songs{list-style:none;margin:0;padding:0}
.songs li+li{border-top:1px solid var(--line)}
.song-row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 4px;cursor:pointer}
.song-row:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.song-row .t{font-weight:600;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-row .a{grid-column:1;color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.note{color:var(--muted);font-size:14px;margin-block:14px 0}
.empty{padding-block:18px 6px;color:var(--muted)}
.empty b{color:var(--fg)}

/* Song */
.song-head h1{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.2;margin:4px 0 2px;text-wrap:balance;letter-spacing:-.01em}
.song-head .by{color:var(--muted);margin:0}
.song-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:13px;background:var(--sunk);border-radius:999px;padding:3px 10px;color:var(--fg)}
.pill b{font-family:var(--f-mono);color:var(--chord)}

.strip{display:flex;gap:8px;overflow-x:auto;padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{all:unset;box-sizing:border-box;flex:0 0 auto;width:84px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px 4px;text-align:center;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip .n{font:700 14px var(--f-mono);color:var(--chord);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .q{display:block;height:64px;line-height:64px;color:var(--muted);font-size:22px}

.sheet-body{font-family:var(--f-mono);font-size:var(--fs);line-height:1.4;white-space:pre;overflow-x:auto;padding-block:6px 12px}
.ln{min-height:1.4em}
.ln.ch{color:var(--chord);font-weight:700}
.ln.gap{min-height:.8em}
.ln.head{font-family:var(--f-body);font-weight:600;font-size:.82em;letter-spacing:.04em;color:var(--muted);margin-top:.5em}
button.c{all:unset;cursor:pointer;color:var(--chord);border-radius:4px;white-space:pre}
button.c:hover{background:var(--sunk)}
button.c:focus-visible{outline:2px solid var(--accent)}

/* Diagrams */
.dia{display:block;width:100%;height:auto;max-width:210px;margin-inline:auto}
.dia .fr{stroke:var(--grid);stroke-width:1.2}
.dia .st{stroke:var(--string);stroke-width:1.4}
.dia .nut{fill:var(--fg)}
.dia .dot{fill:var(--fg)}
.dia .open{fill:none;stroke:var(--fg);stroke-width:1.8}
.dia text{font-family:var(--f-mono);font-weight:700}
.dia .fg{fill:var(--surface);font-size:12px}
.dia .mute{fill:var(--muted);font-size:16px;font-weight:400}
.dia .pos{fill:var(--muted);font-size:13px}
.dia.mini .fg{display:none}
.dia.mini .mute{font-size:20px}

/* Toolbar */
.tools{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.tools-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:12px;padding:3px}
.grp .lbl{font:700 13px var(--f-mono);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.grp .cap{font-size:11px;color:var(--muted);padding-inline:6px 2px;letter-spacing:.03em}
.grp button{background:transparent;border:0;min-width:36px;height:36px;border-radius:9px;color:var(--fg);font:600 15px var(--f-body);display:inline-flex;align-items:center;justify-content:center}
.grp button.on{background:var(--accent);color:var(--on-accent)}
.grp button svg{width:16px;height:16px;fill:currentColor}
.grp.scroll{flex:1 1 220px}
.speed{display:flex;align-items:center;gap:4px;flex:1;min-width:0;padding-inline-end:6px}
.speed .cap{padding:0;font-size:10px}
.speed input{flex:1;min-width:80px;width:auto;padding:0;border:0;background:transparent;accent-color:var(--accent);height:36px}

/* Editor */
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 120px;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.hint code{font-family:var(--f-mono);color:var(--chord);background:var(--sunk);border-radius:4px;padding:0 4px}
.err{color:var(--danger);font-size:13px;min-height:0}

/* Bottom sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.panel h2{font-family:var(--f-mono);font-size:26px;color:var(--chord);margin:0}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.var{background:var(--bg);border-radius:12px;padding:8px 10px 10px}
.var .l{font-size:12px;font-weight:600;text-align:center;margin-top:4px}
.one{padding-block:8px 4px}
.one .dia{max-width:240px}
.one .info{font:14px/1.6 var(--f-mono);color:var(--muted);text-align:center;margin-top:10px}
.var .info{font:12px/1.5 var(--f-mono);color:var(--muted);text-align:center;margin-top:4px}
.panel p{margin:6px 0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:3px;margin-block:2px 12px}

.imp-src{min-height:28vh;font-size:14px}
.imp-defs .btn{margin-top:8px}
.gh-form{max-width:420px;margin-top:10px;gap:10px}
.gh-msg{font-size:14px;color:var(--muted);margin:8px 0 0;min-height:0}
.gh-msg:empty{display:none}
.gh-msg.bad{color:var(--warn)}
#sync a,.steps a{color:var(--accent)}
.imp-prev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:60vh;overflow:auto}
.verdict:empty{display:none}
.verdict:not(.ok):not(.bad){background:var(--sunk);color:var(--muted)}
input.mono{font-family:var(--f-mono)}
.se-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:center}
.se-wrap>div{min-width:0}
.se-base{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;font-size:14px;font-weight:600}
.se-base span{min-width:96px;text-align:center}
.board{display:grid;grid-template-columns:repeat(6,44px);grid-auto-rows:48px}
.board .top{all:unset;cursor:pointer;height:36px;align-self:end;text-align:center;font:400 22px/36px var(--f-mono);color:var(--muted)}
.board .fret{all:unset;cursor:pointer;position:relative;background:linear-gradient(var(--string),var(--string)) center/1.5px 100% no-repeat;border-bottom:1.5px solid var(--grid)}
.board .fret.first{box-shadow:inset 0 5px 0 var(--fg)}
.board .fret:nth-child(n+7):nth-child(-n+12):not(.first){border-top:1.5px solid var(--grid)}
.board .fret.on::after{content:"";position:absolute;inset:0;margin:auto;width:28px;height:28px;border-radius:50%;background:var(--fg)}
.board .fret:hover:not(.on)::after{content:"";position:absolute;inset:0;margin:auto;width:24px;height:24px;border-radius:50%;background:var(--sunk)}
.board .top:focus-visible,.board .fret:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.se-prev{width:200px}
.se-prev .info{font:13px/1.6 var(--f-mono);color:var(--muted);text-align:center;margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:no-preference){
  .panel{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

function barreOf(v){

/* YIN pitch detection on one frame of samples */
function detectPitch(buf,sr){
  let rms=0; for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
  if(Math.sqrt(rms/buf.length)<0.008)return null;
  const W=buf.length>>1,maxLag=Math.min(W-1,Math.floor(sr/60)),minLag=Math.floor(sr/1200);
  const d=new Float32Array(maxLag+1);
  for(let tau=1;tau<=maxLag;tau++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];s+=x*x}d[tau]=s}
  let run=0,tau=-1; const cm=new Float32Array(maxLag+1); cm[0]=1;
  for(let t=1;t<=maxLag;t++){run+=d[t];cm[t]=run?d[t]*t/run:1}
  for(let t=minLag;t<=maxLag;t++){if(cm[t]<0.12){while(t+1<=maxLag&&cm[t+1]<cm[t])t++;tau=t;break}}
  if(tau<0){let best=minLag;for(let t=minLag;t<=maxLag;t++)if(cm[t]<cm[best])best=t;if(cm[best]>0.3)return null;tau=best}
  const a=cm[tau-1]??cm[tau],b=cm[tau],c=cm[tau+1]??cm[tau],den=a-2*b+c;
  const t=den?tau+(a-c)/(2*den):tau;
  return sr/t;
}

/* ---------- metronome: clicks scheduled ahead on the audio clock, so the beat stays steady ---------- */
const M={on:false,bpm:100,beats:4,beat:0,next:0,timer:0,taps:[],saveT:0};
function metroLoad(s){M.bpm=Math.min(240,Math.max(30,+(s&&s.bpm)||100));M.beats=[2,3,4,6].includes(+(s&&s.beats))?+s.beats:4}
function metroClick(t,accent){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='square'; o.frequency.value=accent?1760:1175;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(accent?0.35:0.2,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);

}
function metroTick(){
  if(!M.on)return;
  while(M.next<AC.currentTime+0.12){
    const b=M.beat,t=M.next;
    metroClick(t,b===0);
    setTimeout(()=>metroFlash(b),Math.max(0,(t-AC.currentTime)*1000));
    M.beat=(M.beat+1)%M.beats; M.next+=60/M.bpm;
  }
}
function metroStart(){

  whenRunning(ctx,()=>{M.on=true;M.beat=0;M.next=ctx.currentTime+0.08;clearInterval(M.timer);M.timer=setInterval(metroTick,25);metroTick();metroUI()});

  metroUI();
}
function metroFlash(b){

/* ---------- a video at the end of a song: YouTube, Rutube or VK Video ---------- */
function videoInfo(url){
  url=(url||'').trim(); if(!url)return null;
  let m;
  if((m=url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/i)))
    return {kind:'youtube',name:'YouTube',url,embed:null};
  if((m=url.match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/i)))
    return {kind:'instagram',name:'Instagram',url,embed:'https://www.instagram.com/'+(m[1]==='p'?'p':'reel')+'/'+m[2]+'/embed/',tall:true};
  if((m=url.match(/rutube\.ru\/(?:video|play\/embed|shorts)\/([0-9a-f]{20,})/i)))
    return {kind:'rutube',name:'Rutube',url,embed:'https://rutube.ru/play/embed/'+m[1]};
  if((m=url.match(/(?:vk\.com|vkvideo\.ru|vk\.ru)\/(?:[^?#]*?)video(-?\d+)_(\d+)/i)))
    return {kind:'vk',name:'VK Видео',url,embed:'https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2]+'&hd=2'};
  if(/^https?:\/\//i.test(url))return {kind:'link',name:'видео',url,embed:null};
  return null;
}
const videoLinks=s=>String((s&&s.video)||'').split(/\s+/).filter(x=>/^https?:\/\//i.test(x));

  </section>`;
}

/* ---------- backing track ("минус"): the file stays on this device (IndexedDB); the song keeps its name, length and line marks ---------- */
const TR={el:null,url:'',id:null,has:false,raf:0,cur:-1,marking:false,marks:[],k:0,n:0,seeking:0,vOn:false,vStart:0,vPaused:0};
const hasMarks=()=>TR.marks.some(x=>x!=null);
const vEnd=()=>Math.max(0,...TR.marks.filter(x=>x!=null))+5;
const trackCan=()=>!!window.SONGBOOK_OFFLINE&&'indexedDB' in window;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('songbook-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function trackGet(id){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('tracks').objectStore('tracks').get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch{return null}}
async function trackPut(id,rec){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('tracks','readwrite');t.objectStore('tracks').put(rec,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function trackDelete(id){try{const db=await idb();await new Promise(ok=>{const t=db.transaction('tracks','readwrite');t.objectStore('tracks').delete(id);t.oncomplete=ok;t.onerror=ok})}catch{}}
const fmtTime=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};

async function trackLoad(s){
  trackStop(); TR.id=s.id; TR.marks=Array.isArray(s.marks)?s.marks.slice():[];
  if(S.view==='song')renderTools();
  if(!trackCan()||!s.track)return;
  const rec=await trackGet(s.id);
  if(!rec||S.cur!==s.id||TR.id!==s.id)return;
  const a=new Audio(); TR.url=URL.createObjectURL(rec.blob||new Blob([rec.buf],{type:rec.type||'audio/mp4'}));
  a.preload='auto'; a.setAttribute('playsinline',''); a.src=TR.url;
  a.addEventListener('loadedmetadata',()=>{if(S.view==='song')renderTools()});
  a.addEventListener('ended',()=>{if(TR.marking)markDone();renderTools()});
  a.addEventListener('pause',()=>{if(S.view==='song')renderTools()});
  TR.el=a; TR.has=true;
  if(S.view==='song')renderTools();
}
function trackStop(){
  if(TR.marking&&TR.k>0&&TR.id&&store){const now=Date.now();store.patch(TR.id,{marks:TR.marks.slice(0,TR.k),marksAt:now,updatedAt:now}).catch(()=>{})}
  if(TR.el){try{TR.el.pause();TR.el.removeAttribute('src');TR.el.load()}catch{}}
  if(TR.url)URL.revokeObjectURL(TR.url);
  cancelAnimationFrame(TR.raf);
  const mb=document.getElementById('markbar'); if(mb)mb.remove();
  Object.assign(TR,{el:null,url:'',id:null,has:false,raf:0,cur:-1,marking:false,vOn:false,vPaused:0});
}
function trackTools(){
  if(!TR.has||!TR.el){
    if(!hasMarks()||TR.marking)return '';
    const t=TR.vOn?(performance.now()-TR.vStart)/1000:TR.vPaused;
    return `<div class="grp trackgrp" aria-label="Текст по разметке">
      <button data-act="v-play" class="${TR.vOn?'on':''}" aria-label="${TR.vOn?'Пауза':'Запустить текст по разметке'}">${TR.vOn?ICON.pause:ICON.play}</button>
      <span class="tt" id="t-time">${fmtTime(t)} / ${fmtTime(vEnd())}</span><span class="cap">по разметке</span>
      ${TR.vPaused&&!TR.vOn?'<button data-act="v-reset" aria-label="С начала">↺</button>':''}</div>`;
  }
  const d=isFinite(TR.el.duration)?TR.el.duration:0,t=TR.el.currentTime||0,on=!TR.el.paused;
  return `<div class="grp trackgrp" aria-label="Минус">
    <button data-act="t-play" class="${on?'on':''}" aria-label="${on?'Пауза':'Играть минус'}">${on?ICON.pause:ICON.play}</button>
    <span class="tt" id="t-time">${fmtTime(t)} / ${fmtTime(d)}</span>
    <input type="range" id="t-seek" min="0" max="${Math.max(1,Math.round(d*10))}" value="${Math.round(t*10)}" aria-label="Перемотка минуса"></div>`;
}
function trackToggle(){
  if(!TR.el)return;
  if(TR.el.paused){
    stopAuto();
    TR.el.play().then(()=>{if(!TR.raf)TR.raf=requestAnimationFrame(trackFollow);renderTools()}).catch(()=>toast('Не получилось включить минус. Проверьте, что файл открывается в «Файлах».'));
  }else TR.el.pause();
}
/* each frame: update the clock, then either jump between marked lines or glide through the song */
function trackFollow(){
  const virt=!TR.el;
  if(virt?!TR.vOn:TR.el.paused){TR.raf=0;return}
  TR.raf=requestAnimationFrame(trackFollow);
  const t=virt?(performance.now()-TR.vStart)/1000:TR.el.currentTime,d=virt?vEnd():(TR.el.duration||0);
  if(virt&&t>=d){vReset();return}
  const tm=document.getElementById('t-time'); if(tm)tm.textContent=fmtTime(t)+' / '+fmtTime(d);
  const sk=document.getElementById('t-seek'); if(sk&&Date.now()-TR.seeking>400)sk.value=Math.round(t*10);
  if(TR.marking)return;
  if(TR.marks.some(x=>x!=null)){
    let i=-1; TR.marks.forEach((m,k)=>{if(m!=null&&m<=t+0.05)i=k});
    if(i!==TR.cur){TR.cur=i;lineHL(i,'cur',true)}
  }else if(d>0){
    const el=document.scrollingElement||document.documentElement,max=el.scrollHeight-innerHeight;
    if(max>0){const y=Math.round(max*Math.min(1,t/d));if(Math.abs(y-scrollY)>1)scrollTo(0,y)}
  }
}
function lineHL(li,cls,scroll){
  document.querySelectorAll('.ln.'+cls).forEach(e=>e.classList.remove(cls));
  if(li<0)return;
  const ly=document.querySelector(`.ln[data-li="${li}"]`); if(!ly)return;
  ly.classList.add(cls);
  document.querySelectorAll(`.ln[data-pli="${li}"]`).forEach(e=>e.classList.add(cls));
  if(scroll){const top=scrollY+ly.getBoundingClientRect().top-innerHeight*0.35;scrollTo({top:Math.max(0,top),behavior:'smooth'})}
}
function vToggle(){
  if(TR.el||!hasMarks())return;
  if(TR.vOn){TR.vPaused=(performance.now()-TR.vStart)/1000;TR.vOn=false}
  else{stopAuto();TR.vStart=performance.now()-TR.vPaused*1000;TR.vOn=true;if(!TR.raf)TR.raf=requestAnimationFrame(trackFollow)}
  renderTools();
}
function vReset(){TR.vOn=false;TR.vPaused=0;cancelAnimationFrame(TR.raf);TR.raf=0;TR.cur=-1;lineHL(-1,'cur');renderTools()}
async function trackAdd(file){
  const s=findSong(S.cur); if(!s||s.demo)return;
  if(file.size>150*1024*1024){toast('Файл больше 150 МБ. Сожмите его в m4a или mp3.');return}
  toast('Добавляю минус…');
  const url=URL.createObjectURL(file),probe=new Audio();
  const dur=await new Promise(ok=>{const tm=setTimeout(()=>ok(0),8000);probe.addEventListener('loadedmetadata',()=>{clearTimeout(tm);ok(probe.duration||0)});probe.addEventListener('error',()=>{clearTimeout(tm);ok(-1)});probe.preload='metadata';probe.src=url});
  URL.revokeObjectURL(url);
  if(dur<0){toast('Этот файл не воспроизводится на айфоне. Подойдут m4a, mp3, wav или aac.');return}
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const type=file.type||({m4a:'audio/mp4',mp3:'audio/mpeg',wav:'audio/wav',aac:'audio/aac',aif:'audio/aiff',aiff:'audio/aiff'}[ext])||'audio/mp4';
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch{}
  try{
    const buf=await file.arrayBuffer();
    await trackPut(s.id,{buf,type,name:file.name,size:file.size,added:Date.now()});
  }catch(e){
    const n=e&&e.name||'';
    toast(n==='QuotaExceededError'?'Не хватило места на устройстве для этого файла.':'Не получилось сохранить минус'+(n?' ('+n+')':'')+'. Напишите мне этот текст.');
    return;
  }
  try{await store.patch(s.id,{track:{name:file.name,dur:Math.round(dur)},updatedAt:Date.now()})}catch(e){saveErr(e);return}
  closeSheet(); await trackLoad(findSong(s.id)); toast('Минус добавлен');
}
async function trackRemove(btn){
  if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.lastChild.textContent='Точно удалить минус?';return}
  const s=findSong(S.cur); if(!s)return;
  trackStop(); await trackDelete(s.id);
  try{await store.patch(s.id,{track:null,updatedAt:Date.now()})}catch(e){saveErr(e)}
  closeSheet(); renderTools(); toast('Минус удалён');

/* marking: the track plays from the start and each tap stamps the time of the next lyric line */
function markStart(){
  if(!TR.el)return; closeSheet();
  const n=document.querySelectorAll('.ln[data-li]').length;
  if(!n){toast('В песне нет строк текста.');return}
  stopAuto(); exitStage();
  Object.assign(TR,{marking:true,marks:[],k:0,n,cur:-1}); lineHL(-1,'cur');
  const bar=document.createElement('div'); bar.id='markbar'; bar.className='markbar';
  bar.innerHTML=`<p>Нажимайте <b>«Строка»</b> в момент, когда начинается каждая строка. Ошиблись — «Назад».</p>
    <div class="mk-btns"><button class="btn" data-act="mk-undo">Назад</button>
    <button class="btn primary mk-main" data-act="mk-tap" id="mk-main">Строка 1 из ${n}</button>
    <button class="btn" data-act="mk-done">Готово</button></div>
    <button class="link2" data-act="mk-cancel">Отменить разметку</button>`;
  document.body.appendChild(bar);
  lineHL(0,'next',true);
  TR.el.currentTime=0;
  TR.el.play().then(()=>{if(!TR.raf)TR.raf=requestAnimationFrame(trackFollow);renderTools()}).catch(()=>{});
}
function markTap(){
  if(!TR.marking||!TR.el)return;
  TR.marks[TR.k]=Math.round(TR.el.currentTime*100)/100; TR.k++;
  if(TR.k>=TR.n){markDone();return}
  lineHL(TR.k,'next',true); markLabel();
}
function markUndo(){
  if(!TR.marking||!TR.k)return;
  TR.k--; TR.marks.length=TR.k;
  TR.el.currentTime=Math.max(0,(TR.k?TR.marks[TR.k-1]:0)-0.5);
  lineHL(TR.k,'next',true); markLabel();
}

  lineHL(-1,'next'); if(TR.el)TR.el.pause();

function trackMenu(s){
  if(s.demo)return '';
  if(!trackCan())return '<p class="hint">Минусы работают в приложении с экрана «Домой».</p>';
  const add=`<label class="btn" for="track-file">${ICON.music}${s.track&&TR.has?'Заменить минус':'Добавить минус'}</label><input type="file" id="track-file" class="vh" accept="audio/*,.m4a,.mp3,.wav,.aac,.aif,.aiff">`;
  if(!TR.has){

    return add+(s.track?`<p class="hint">Минус «${esc(s.track.name)}» хранится на другом устройстве. Выберите здесь тот же файл, и текст пойдёт за ним по готовой разметке.</p>`:'')

const TAB_LINE=/^\s*[A-Ga-g]?#?\s*\|?[-0-9|hpbrxX\/\\~()\s]{6,}\|?\s*$/;

let stageWake=null;
async function enterStage(){
  if(S.view!=='song')return;
  S.stage=true; document.body.classList.add('stage');
  document.getElementById('body').style.setProperty('--fs',S.sfs+'px');
  renderTools(); scrollTo(0,0);
  try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'})}catch{}
  try{stageWake=await navigator.wakeLock.request('screen')}catch{stageWake=null}
}
function exitStage(){
  if(!S.stage)return;
  S.stage=false; document.body.classList.remove('stage');
  if(stageWake){stageWake.release().catch(()=>{});stageWake=null}
  try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
  const b=document.getElementById('body'); if(b)b.style.setProperty('--fs',S.fs+'px');
  if(S.view==='song')renderTools();
}
/* In stage mode a tap on the lower part of the page turns forward, on the upper part back */
function stageTap(e){
  const down=e.clientY>innerHeight*0.35, step=Math.round(innerHeight*0.8);
  scrollBy({top:down?step:-step,behavior:'smooth'});
}
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S.stage&&!stageWake){try{stageWake=await navigator.wakeLock.request('screen')}catch{}}});

function applySkin(id){
  const root=document.documentElement;
  if(!SKINS.some(s=>s.id===id))id='auto';
  if(id==='auto')delete root.dataset.skin; else root.dataset.skin=id;
  S.skin=id;
  const bg=getComputedStyle(root).getPropertyValue('--bg').trim();
  themeMetas.forEach(({m,c,media})=>{
    if(id==='auto'){m.setAttribute('content',c);if(media)m.setAttribute('media',media)}
    else{m.setAttribute('content',bg);m.removeAttribute('media')}
  });
}

    +(S.loaded&&S.mode==='cloud'&&!empty?`${S.songs.length} ${plural(S.songs.length,'песня','песни','песен')} · видны только вам`:'');

function fillSong(){
  const s=findSong(S.cur); if(!s)return;
  const flats=usesFlats(s.body),seen=[];
  const plain=S.textOnly;
  let lines=parseSong(s.body),li=0;
  lines=lines.map(l=>l.k==='ly'&&l.t.trim()&&!TAB_LINE.test(l.t)?{...l,li:li++}:l);
  lines.forEach((l,i)=>{if(l.k==='ch'&&lines[i+1]&&lines[i+1].li!=null)l.pli=lines[i+1].li});
  if(plain){
    // text only: drop chord lines and tab staves, then squeeze the blank lines that leaves behind
    lines=lines.filter(l=>l.k!=='ch'&&!(l.k==='ly'&&TAB_LINE.test(l.t)));
    lines=lines.filter((l,i)=>!(l.k==='gap'&&(i===0||lines[i-1].k==='gap')));
  }
  const html=lines.map(l=>
    l.k==='gap'?'<div class="ln gap"></div>':
    l.k==='head'?`<div class="ln head">${esc(l.t)}</div>`:
    l.k==='ch'?`<div class="ln ch"${l.pli!=null?` data-pli="${l.pli}"`:''}>${chordLineHtml(l.s,S.shift,flats,seen)}</div>`:
    `<div class="ln ly"${l.li!=null?` data-li="${l.li}"`:''}>${esc(l.t)||' '}</div>`).join('');
  const bodyEl=document.getElementById('body');
  bodyEl.innerHTML=html||'<div class="ln ly">Текст песни пока пустой.</div>';
  bodyEl.classList.toggle('plain',plain);
  document.getElementById('strip').hidden=plain;
  const vb=document.getElementById('videobox'); if(vb&&vb.dataset.v!==(s.video||'')){vb.dataset.v=s.video||'';vb.innerHTML=videoHtml(s)}
  document.getElementById('strip').innerHTML=seen.map(n=>{
    const v=getVoicings(n).list[0];
    return `<button class="chip" data-act="chord" data-c="${esc(n)}"><span class="n">${esc(n)}</span>${v?diagram(v,true):'<span class="q">?</span>'}</button>`}).join('');
  const meta=[];
  (s.tags||[]).forEach(t=>meta.push(`<button class="pill tagpill" data-act="tagfilter" data-t="${esc(t)}">${esc(t)}</button>`));
  if(+s.capo)meta.push(`<span class="pill">Каподастр: ${+s.capo} лад</span>`);
  if(S.shift)meta.push(`<span class="pill">Тональность сдвинута на ${S.shift>0?'+':''}${S.shift}</span>`);
  if(s.track)meta.push(`<span class="pill">Минус: ${fmtTime(s.track.dur)}</span>`);
  const nMarks=Array.isArray(s.marks)?s.marks.filter(x=>x!=null).length:0;
  if(nMarks)meta.push(`<span class="pill">Разметка: ${nMarks} ${plural(nMarks,'строка','строки','строк')}</span>`);
  document.getElementById('meta').innerHTML=meta.join('');
  if(TR.cur>=0)lineHL(TR.cur,'cur',false);
  if(TR.marking)lineHL(TR.k,'next',false);
}

/* ---------- backup file ---------- */
async function exportBackup(){
  const data=JSON.stringify({app:'songbook',version:1,exportedAt:new Date().toISOString(),songs:S.songs,shapes:S.shapes},null,1);
  const d=new Date(),fn=`pesennik-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  if(!window.SONGBOOK_OFFLINE&&window.claude&&window.claude.use){
    const dl=await claude.use('downloads');
    if(dl){try{await dl.save({filename:fn,data});toast('Копия сохранена')}catch(e){if(!e||e.code!=='declined')toast('Не получилось сохранить файл.')}return}
  }
  try{
    const file=new File([data],fn,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
async function importBackup(file){
  let d; try{d=JSON.parse(await file.text())}catch{d=null}
  if(!d||d.app!=='songbook'||!Array.isArray(d.songs)){toast('Это не файл копии песенника.');return}
  let n=0;
  try{
    for(const s of d.songs){
      if(!s||!s.id||String(s.id).startsWith('_')||!s.title||typeof s.body!=='string')continue;
      await store.save({...s});n++;
    }
    if(d.shapes&&typeof d.shapes==='object'&&Object.keys(d.shapes).length){
      const next={...S.shapes,...d.shapes};S.shapes=next;setShapes(next);
      await store.save({id:'_shapes',shapes:next});
    }
    toast(`Загружено: ${n} ${plural(n,'песня','песни','песен')}`);
  }catch(e){saveErr(e)}
}

function fretsText(f){return f.map(x=>x<0?'x':x).join(' ')}
function parseFretsText(t){
  const s=t.trim().toLowerCase().replace(/[хx×]/g,'x');
  const parts=/[\s,\-]/.test(s)?s.split(/[\s,\-]+/).filter(Boolean):[...s];
  if(parts.length!==6)return null;
  const f=parts.map(p=>p==='x'?-1:/^\d{1,2}$/.test(p)?+p:NaN);
  return f.some(x=>Number.isNaN(x)||x>22)?null:f;
}

let raf=0,lastT=null,acc=0,wake=null;
function tick(t){
  if(!S.scroll.on)return;
  if(lastT!=null){acc+=S.scroll.speed*(t-lastT)/1000;if(acc>=1){const n=Math.floor(acc);acc-=n;scrollBy(0,n)}
    const el=document.scrollingElement||document.documentElement;
    if(innerHeight+scrollY>=el.scrollHeight-2){stopAuto();renderTools();return}}
  lastT=t;raf=requestAnimationFrame(tick);
}
async function startScroll(){S.scroll.on=true;lastT=null;acc=0;raf=requestAnimationFrame(tick);
  try{wake=await navigator.wakeLock.request('screen')}catch{wake=null}}
function stopScroll(){if(document.body.classList.contains('vfull-on'))videoExit();tunerStop();metroStop();trackStop();stopAuto()}

  else if(a==='sc-root'){scState.root=+b.dataset.i;scSave()}
  else if(a==='sc-lab'){scState.labels=b.dataset.v;scSave()}

  else if(a==='cof'){const i=+b.dataset.i,mi=b.dataset.m==='1';if(b.tagName.toLowerCase()==='g'){unlockAudio(3);playChord(mi?COF_MIN[i]+'m':COF_MAJ[i])}cofSelect(i,mi)}
  else if(a==='play'){unlockAudio(3);stopProg();playChord(b.dataset.c)}

  else if(a==='play-scale')playScale();

  else if(a==='play-prog'){const names=b.dataset.c.split('|');unlockAudio(names.length*1.1+2);playProg(b,names)}
  else if(a==='cof-mode')cofSelect(cofState.i,b.dataset.m==='1');

    S.shapes=next;setShapes(next);b.disabled=true;b.textContent='Добавлено';
    store.save({id:'_shapes',shapes:next}).then(()=>toast('Схемы добавлены в «Мои схемы»'),saveErr);
  }
  else if(a==='new-shape')renderShapeEditor(null);

  else if(a==='fs'){

    else{S.fs=Math.min(26,Math.max(12,S.fs+ +b.dataset.d*2));lsSet('sb.fs',S.fs);document.getElementById('body').style.setProperty('--fs',S.fs+'px')}

/* ---------- sync with a GitHub repository (home-screen app only: claude.ai pages cannot reach other sites) ---------- */
let RAW=null;
const GH={cfg:(()=>{try{return JSON.parse(lsGet('sb.gh')||'null')}catch{return null}})(),busy:false,timer:0,msg:'',err:false,pub:false,sureOff:false};
const DEL=(()=>{try{return JSON.parse(lsGet('sb.deleted')||'{}')||{}}catch{return {}}})(); // id or "shape:Name" → when it was deleted
function saveDel(){lsSet('sb.deleted',JSON.stringify(DEL))}
const ghCan=()=>!!window.SONGBOOK_OFFLINE;
const ghOn=()=>ghCan()&&!!(GH.cfg&&GH.cfg.repo&&GH.cfg.token);
function wrapStore(st){
  return {
    subscribe:st.subscribe,
    async save(s){await st.save(s);ghSoon()},
    async patch(id,p){await st.patch(id,p);ghSoon()},
    async remove(id){DEL[id]=Date.now();saveDel();await st.remove(id);ghSoon()}
  };
}
function ghSoon(){if(!ghOn())return;clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghSync(),3500)}
function b64encUtf8(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64decUtf8(b64){const bin=atob(b64.replace(/\s/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
async function ghFetch(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+GH.cfg.repo+path,{cache:'no-store',...opt,
    headers:{Authorization:'Bearer '+GH.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('github '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function ghGetFile(){try{return await ghFetch('/contents/songbook.json?ts='+Date.now())}catch(e){if(e.status===404)return null;throw e}}
/* Newest edit of each song wins; a deletion wins over any edit made before it */
function mergeData(local,remote){
  const del={...((remote&&remote.deleted)||{})};
  for(const [k,v] of Object.entries(DEL))if(!(del[k]>=v))del[k]=v;
  const map=new Map();
  for(const s of (remote&&remote.songs)||[])if(s&&s.id)map.set(s.id,s);
  for(const s of local.songs){
    const o=map.get(s.id); if(!o){map.set(s.id,s);continue}
    let w=(s.updatedAt||0)>=(o.updatedAt||0)?s:o; const l=w===s?o:s;
    if((l.marksAt||0)>(w.marksAt||0))w={...w,marks:l.marks,marksAt:l.marksAt};
    map.set(s.id,w);
  }
  const songs=[...map.values()].filter(s=>!(del[s.id]>=(s.updatedAt||0))).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const shapes={};
  for(const src of [(remote&&remote.shapes)||{},local.shapes])for(const [n,v] of Object.entries(src))
    if(!shapes[n]||(v.t||0)>=(shapes[n].t||0))shapes[n]=v;
  for(const n of Object.keys(shapes))if(del['shape:'+n]>=(shapes[n].t||0))delete shapes[n];
  return {app:'songbook',version:1,songs,shapes,deleted:del};
}
async function applyMerged(m){
  Object.assign(DEL,m.deleted); saveDel();
  const local=new Map(S.songs.map(s=>[s.id,s]));
  for(const s of m.songs){const o=local.get(s.id);if(!o||JSON.stringify(o)!==JSON.stringify(s))await RAW.save({...s})}
  const keep=new Set(m.songs.map(s=>s.id));
  for(const s of S.songs.slice())if(!keep.has(s.id))await RAW.remove(s.id);
  if(JSON.stringify(m.shapes)!==JSON.stringify(S.shapes))await RAW.save({id:'_shapes',shapes:m.shapes});
}
const canon=d=>JSON.stringify({songs:d.songs,shapes:d.shapes,deleted:d.deleted});
async function ghSync(report){
  if(!ghOn()||GH.busy)return;
  if(!navigator.onLine){ghStatus('Нет интернета. Синхронизирую, когда он появится.',false);return}
  GH.busy=true; ghStatus('Синхронизирую…',false);
  try{
    for(let attempt=0;attempt<3;attempt++){
      const file=await ghGetFile();
      const remote=file?JSON.parse(b64decUtf8(file.content)):null;
      const merged=mergeData({songs:S.songs,shapes:S.shapes},remote);
      await applyMerged(merged);
      if(remote&&canon(remote)===canon(merged))break;
      const out={...merged,exportedAt:new Date().toISOString()};
      try{await ghFetch('/contents/songbook.json',{method:'PUT',body:JSON.stringify({message:'Песенник: синхронизация',content:b64encUtf8(JSON.stringify(out,null,1)),...(file?{sha:file.sha}:{})})});break}
      catch(e){if((e.status===409||e.status===422)&&attempt<2)continue;throw e}  // changed on another device meanwhile: merge again
    }
    GH.cfg.last=Date.now(); lsSet('sb.gh',JSON.stringify(GH.cfg)); ghStatus('',false);
    if(report){const n=S.songs.length,m=S.songs.filter(x=>Array.isArray(x.marks)&&x.marks.some(v=>v!=null)).length;
      toast('Синхронизировано с GitHub: '+n+' '+plural(n,'песня','песни','песен')+(m?', с разметкой: '+m:''))}
  }catch(e){ghStatus(ghErrText(e),true)}
  finally{GH.busy=false;fillSync()}
}
function ghErrText(e){
  if(e.status===401)return 'GitHub не принял токен: он неверный или истёк. Отключите синхронизацию и подключите заново с новым токеном.';
  if(e.status===403)return 'У токена нет права записи. При создании токена выберите для этого репозитория Contents: Read and write.';
  if(e.status===404)return 'Репозиторий не найден. Проверьте название (имя/репозиторий) и что токену дан доступ к нему.';
  return 'Не удалось связаться с GitHub. Попробую ещё раз позже.';
}
function ghStatus(t,err){GH.msg=t;GH.err=!!err;const el=document.getElementById('gh-msg');if(el){el.textContent=t;el.className='gh-msg'+(err?' bad':'')}}
async function ghConnect(){
  const repo=(document.getElementById('gh-repo').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const token=(document.getElementById('gh-token').value||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ghStatus('Введите репозиторий в виде имя/репозиторий, например ivan/my-songs.',true);return}
  if(!token){ghStatus('Вставьте токен GitHub.',true);return}
  GH.cfg={repo,token}; ghStatus('Проверяю доступ…',false);
  try{const info=await ghFetch('');GH.pub=!info.private}
  catch(e){GH.cfg=null;ghStatus(ghErrText(e),true);return}
  lsSet('sb.gh',JSON.stringify(GH.cfg)); fillSync(); ghSync();
}
function ghOff(btn){
  if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent='Точно отключить?';return}
  GH.cfg=null; lsSet('sb.gh','null'); ghStatus('',false); fillSync();
}
function fillSync(){
  const el=document.getElementById('sync'); if(!el)return;
  const h='<h3 class="sec-h">Синхронизация с GitHub</h3>';
  if(!ghCan()){el.innerHTML=h+`<p class="sec-p">Работает в приложении с экрана «Домой» (<a href="${OFFLINE_URL}" target="_blank" rel="noopener">${OFFLINE_URL.replace('https://','')}</a>): там песни сами сохраняются в ваш репозиторий на GitHub.</p>`;return}
  if(!ghOn()){
    el.innerHTML=h+`<p class="sec-p">Песни будут сами сохраняться в файл songbook.json в вашем репозитории и подтягиваться оттуда на других устройствах.</p>
      <ol class="steps">
        <li>На github.com создайте <b>приватный</b> репозиторий, например <b>songbook-data</b>.</li>
        <li>Создайте токен: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Settings → Developer settings → Fine-grained tokens</a>. В «Repository access» выберите только этот репозиторий, в «Permissions» → <b>Contents: Read and write</b>.</li>
        <li>Впишите репозиторий в виде <b>имя/репозиторий</b>, вставьте токен и нажмите «Подключить». Это нужно сделать один раз на каждом устройстве: подключение запоминается, токен хранится только в этом телефоне.</li>
      </ol>
      <div class="form gh-form">
        <div class="field"><label for="gh-repo">Репозиторий</label><input id="gh-repo" placeholder="имя/репозиторий" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label for="gh-token">Токен</label><input id="gh-token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="actions" style="justify-content:flex-start;margin-top:0"><button class="btn primary" data-act="gh-connect">Подключить</button></div>
      </div>
      <p id="gh-msg" class="gh-msg${GH.err?' bad':''}">${esc(GH.msg)}</p>`;
    return;
  }
  const last=GH.cfg.last?new Date(GH.cfg.last):null;
  el.innerHTML=h+`<p class="sec-p">Подключено к <b>${esc(GH.cfg.repo)}</b>, файл songbook.json.
      ${last?`Последняя синхронизация: ${last.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}, ${last.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}.`:''}</p>
    ${GH.pub?'<p class="gh-msg bad">Репозиторий открытый: ваши песни сможет прочитать кто угодно. Лучше сделать его приватным в настройках репозитория на GitHub.</p>':''}
    <div class="actions" style="justify-content:flex-start;margin-top:0">
      <button class="btn primary" data-act="gh-sync"${GH.busy?' disabled':''}>Синхронизировать сейчас</button>
      <button class="btn danger" data-act="gh-off">Отключить</button>
    </div>
    <p id="gh-msg" class="gh-msg${GH.err?' bad':''}">${esc(GH.msg)}</p>`;
}
function ghStart(){
  if(!ghOn())return;
  ghSync();
  addEventListener('online',()=>ghSync());
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(GH.cfg&&GH.cfg.last||0)>60000)ghSync()});
}

/* ---------- boot ---------- */
applySkin(lsGet('sb.skin')||'auto');
renderList();
initStore().then(st=>{
  RAW=st; store=wrapStore(st);
  st.subscribe(list=>{
    const prev=S.cur?findSong(S.cur):null;
    S.songs=list.filter(s=>!String(s.id).startsWith('_'));
    S.checks=(list.find(s=>s.id==='_checks')||{}).checked||{};
    const shapes=(list.find(s=>s.id==='_shapes')||{}).shapes||{};
    const shapesChanged=JSON.stringify(shapes)!==JSON.stringify(S.shapes);
    if(shapesChanged){S.shapes=shapes;setShapes(shapes)}
    S.loaded=true;
    if(S.view==='list')fillList();
    else if(S.view==='chart')fillChart();
    else if(S.view==='song'&&shapesChanged&&findSong(S.cur))fillSong();
    else if(S.view==='song'){const now=findSong(S.cur);
      if(!now){S.cur=null;renderList()}
      else if(!prev||prev.body!==now.body||prev.title!==now.title||prev.artist!==now.artist||prev.capo!==now.capo)renderSong(S.cur,true)}
  });
  ghStart();
});
</script>

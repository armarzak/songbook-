<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fire Chords">
<meta name="theme-color" content="#F1F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="fire-180.png">
<link rel="icon" type="image/png" href="fire-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.SONGBOOK_OFFLINE=true</script>
</head>
<body><title>Fire Chords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  /* Layout: one-column phone songbook. Sticky header, monospaced chord sheet, toolbar in thumb reach at the bottom. */
  --bg:#F1F2EE; --surface:#FFFFFF; --sunk:#E5E8E1; --fg:#191B19; --muted:#636A61; --line:#D3D8CD;
  --chord:#1A57AE; --accent:#1A57AE; --on-accent:#FFFFFF; --danger:#B3261E; --bar:rgba(241,242,238,.94); --grid:#CDD2C8; --string:#9AA196; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#2D7A3E; --good-bg:#E2F1E5; --shadow:rgba(0,0,0,.1); --scrim:rgba(10,12,10,.38);
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111312; --surface:#1A1D1B; --sunk:#232724; --fg:#ECEEE9; --muted:#9BA298; --line:#2F3430;
    --chord:#86B6FF; --accent:#86B6FF; --on-accent:#0A1424; --danger:#FF8A80; --bar:rgba(17,19,18,.94); --grid:#343A35; --string:#5E665F; --warn:#F2A35E; --warn-bg:#33251A; --good:#7DD08E; --good-bg:#1C2E20; --shadow:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#1A1D1B; --sunk:#232724; --fg:#ECEEE9; --muted:#9BA298; --line:#2F3430;
  --chord:#86B6FF; --accent:#86B6FF; --on-accent:#0A1424; --danger:#FF8A80; --bar:rgba(17,19,18,.94); --grid:#343A35; --string:#5E665F; --warn:#F2A35E; --warn-bg:#33251A; --good:#7DD08E; --good-bg:#1C2E20; --shadow:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
/* Chosen skins override the automatic light/dark palette */
:root[data-skin="midnight"]{
  --bg:#000000; --surface:#0E0E10; --sunk:#1B1B1F; --fg:#F2EFE9; --muted:#9A968E; --line:#27272C;
  --chord:#FFB648; --accent:#FFB648; --on-accent:#1A1100; --danger:#FF7A6E; --bar:rgba(0,0,0,.9); --scrim:rgba(0,0,0,.65);
  --grid:#2A2A30; --string:#5C5C64; --warn:#FF9F5A; --warn-bg:#2A1A0C; --good:#7DD08E; --good-bg:#12241A; --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-skin="ocean"]{
  --bg:#0B1622; --surface:#112233; --sunk:#182C41; --fg:#E6F1FA; --muted:#8FA6BA; --line:#223B53;
  --chord:#5EE0D0; --accent:#5EE0D0; --on-accent:#04201D; --danger:#FF8A80; --bar:rgba(11,22,34,.92); --scrim:rgba(2,8,14,.6);
  --grid:#25415B; --string:#4F6E89; --warn:#F7B267; --warn-bg:#2E2416; --good:#7FE3A6; --good-bg:#12302A; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-skin="lavender"]{
  --bg:#F4F2FA; --surface:#FFFFFF; --sunk:#E9E5F5; --fg:#1E1A2E; --muted:#6B6585; --line:#DAD4EC;
  --chord:#6A3FD0; --accent:#6A3FD0; --on-accent:#FFFFFF; --danger:#B3261E; --bar:rgba(244,242,250,.92); --scrim:rgba(20,14,40,.35);
  --grid:#D3CCE8; --string:#9C94B8; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#2D7A3E; --good-bg:#E2F1E5; --shadow:rgba(40,20,90,.12);
  color-scheme:light;
}
:root[data-skin="mint"]{
  --bg:#EEF6F2; --surface:#FFFFFF; --sunk:#DDEDE6; --fg:#14231D; --muted:#5B7068; --line:#CFE2DA;
  --chord:#0E7A64; --accent:#0E7A64; --on-accent:#FFFFFF; --danger:#B3261E; --bar:rgba(238,246,242,.92); --scrim:rgba(8,30,22,.35);
  --grid:#C6DCD3; --string:#8FA89E; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#1F7A3A; --good-bg:#DDF2E3; --shadow:rgba(10,60,40,.12);
  color-scheme:light;
}
:root[data-skin="neon"]{
  --bg:#0F0B1A; --surface:#18122A; --sunk:#221A3A; --fg:#F1EAFF; --muted:#A497C2; --line:#2E2548;
  --chord:#FF6AD5; --accent:#FF6AD5; --on-accent:#2A0420; --danger:#FF8A80; --bar:rgba(15,11,26,.9); --scrim:rgba(5,2,12,.65);
  --grid:#2F2650; --string:#5E5285; --warn:#FFB86B; --warn-bg:#2E2014; --good:#7DF0B0; --good-bg:#13291F; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-skin="sakura"]{
  --bg:#FFF2F6; --surface:#FFFFFF; --sunk:#FBE3EB; --fg:#2B1520; --muted:#7D5B69; --line:#F2D3DF;
  --chord:#B8195A; --accent:#B8195A; --on-accent:#FFFFFF; --danger:#A3201A; --bar:rgba(255,242,246,.92); --scrim:rgba(40,8,22,.35);
  --grid:#EDCBD8; --string:#BE97A7; --warn:#A8520A; --warn-bg:#FBEBDD; --good:#2D7A3E; --good-bg:#E2F1E5; --shadow:rgba(110,20,60,.12);
  color-scheme:light;
}
:root[data-skin="graphite"]{
  --bg:#17181B; --surface:#202226; --sunk:#2A2D32; --fg:#ECEDEF; --muted:#9A9EA6; --line:#33363C;
  --chord:#FF8A3D; --accent:#FF8A3D; --on-accent:#261100; --danger:#FF8A80; --bar:rgba(23,24,27,.92); --scrim:rgba(0,0,0,.6);
  --grid:#383C42; --string:#62666E; --warn:#FFB86B; --warn-bg:#2E2216; --good:#7DD08E; --good-bg:#15281B; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
/* "Сияние светлое": the same glow-and-glass look on a light ground, with a black primary button */
:root[data-skin="glowlight"]{
  --bg:#F6F7FB; --surface:rgba(255,255,255,.62); --sunk:rgba(15,23,42,.055); --fg:#0B0B12; --muted:#52525B; --line:rgba(15,23,42,.1);
  --chord:#1D4ED8; --accent:#2563EB; --on-accent:#FFFFFF; --danger:#DC2626; --bar:rgba(246,247,251,.66); --scrim:rgba(15,15,30,.35);
  --grid:rgba(15,23,42,.14); --string:rgba(15,23,42,.35); --warn:#B45309; --warn-bg:rgba(245,158,11,.14); --good:#15803D; --good-bg:rgba(34,197,94,.14); --shadow:rgba(30,41,90,.12);
  --f-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-skin="glowlight"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 0% 0%,rgba(59,130,246,.24),transparent 70%),radial-gradient(55% 45% at 100% 100%,rgba(168,85,247,.22),transparent 70%)}
:root[data-skin="glowlight"] body{isolation:isolate}
:root[data-skin="glowlight"] .brand,:root[data-skin="glowlight"] h1,:root[data-skin="glowlight"] .song-head h1,:root[data-skin="glowlight"] .cof-head h2,:root[data-skin="glowlight"] .sc-head h2{font-weight:900;letter-spacing:-.025em}
:root[data-skin="glowlight"] .btn,:root[data-skin="glowlight"] input,:root[data-skin="glowlight"] select,:root[data-skin="glowlight"] textarea{border-radius:14px}
:root[data-skin="glowlight"] .btn{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glowlight"] .btn.primary{background:#0B0B12;color:#FFFFFF;border-color:transparent;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:13px;box-shadow:0 12px 24px -10px rgba(15,23,42,.35)}
:root[data-skin="glowlight"] input:focus,:root[data-skin="glowlight"] textarea:focus,:root[data-skin="glowlight"] select:focus{outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.45)}
:root[data-skin="glowlight"] .panel{background:rgba(255,255,255,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(15,23,42,.08);border-bottom:0}
:root[data-skin="glowlight"] .chip,:root[data-skin="glowlight"] .tabs,:root[data-skin="glowlight"] .grp,:root[data-skin="glowlight"] .seg{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glowlight"] .dia .fg{fill:#FFFFFF}
:root[data-skin="glowlight"] .t-strings span.on,:root[data-skin="glowlight"] .cell .badge,:root[data-skin="glowlight"] .cell .tick{color:#FFFFFF}

/* "Сияние": the user's Songbook Pro login look — near-black ground, blue and violet glows, glass surfaces, white primary button */
:root[data-skin="glow"]{
  --bg:#0A0A0D; --surface:rgba(255,255,255,.055); --sunk:rgba(255,255,255,.085); --fg:#FFFFFF; --muted:#A1A1AA; --line:rgba(255,255,255,.1);
  --chord:#93C5FD; --accent:#60A5FA; --on-accent:#0A0F1F; --danger:#F87171; --bar:rgba(10,10,13,.62); --scrim:rgba(0,0,0,.6);
  --grid:rgba(255,255,255,.12); --string:rgba(255,255,255,.3); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12); --good:#4ADE80; --good-bg:rgba(74,222,128,.12); --shadow:rgba(0,0,0,.5);
  --f-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-skin="glow"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 0% 0%,rgba(37,99,235,.38),transparent 70%),radial-gradient(55% 45% at 100% 100%,rgba(147,51,234,.34),transparent 70%)}
:root[data-skin="glow"] body{isolation:isolate}
:root[data-skin="glow"] .brand,:root[data-skin="glow"] h1,:root[data-skin="glow"] .song-head h1,:root[data-skin="glow"] .cof-head h2,:root[data-skin="glow"] .sc-head h2{font-weight:900;letter-spacing:-.025em}
:root[data-skin="glow"] .btn,:root[data-skin="glow"] input,:root[data-skin="glow"] select,:root[data-skin="glow"] textarea{border-radius:14px}
:root[data-skin="glow"] .btn{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glow"] .btn.primary{background:#FFFFFF;color:#000000;border-color:transparent;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:13px;box-shadow:0 12px 24px -8px rgba(255,255,255,.12)}
:root[data-skin="glow"] input:focus,:root[data-skin="glow"] textarea:focus,:root[data-skin="glow"] select:focus{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,.5)}
:root[data-skin="glow"] .panel{background:rgba(22,22,28,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);border-bottom:0}
:root[data-skin="glow"] .chip,:root[data-skin="glow"] .tabs,:root[data-skin="glow"] .grp,:root[data-skin="glow"] .seg{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
:root[data-skin="glow"] .tabs button[aria-pressed="true"],:root[data-skin="glow"] .tabs button[aria-selected="true"]{background:rgba(255,255,255,.14)}
/* text that sits on solid light marks needs a dark ink here, not the see-through surface */
:root[data-skin="glow"] .dia .fg{fill:#0A0A0D}
:root[data-skin="glow"] .t-strings span.on,:root[data-skin="glow"] .cell .badge,:root[data-skin="glow"] .cell .tick{color:#0A0A0D}

body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
/* no double-tap zoom anywhere in the app */
html{touch-action:manipulation}
/* the document never scrolls (iOS shifts fixed bottom bars when it does): <body> is the scroll area inside a still page */
html{height:100%;overflow:hidden;box-sizing:border-box;overscroll-behavior:none}
body{height:100%;margin:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
.tools,.tabbar{-webkit-transform:translateZ(0);transform:translateZ(0)}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
body.has-tools .wrap{padding-block-end:calc(var(--toolsh,120px) + 28px)}

.bar{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;min-height:60px}
.bar-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;flex:none}

.btn{font:500 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 13px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.icon{width:40px;padding:0}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

input,select,textarea{font:16px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{font-family:var(--f-mono);font-size:16px;line-height:1.4;min-height:50vh;resize:vertical;white-space:pre;overflow-x:auto}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* Library */
.search{margin-block:4px 8px}
.songs{list-style:none;margin:0;padding:0}
.songs li+li{border-top:1px solid var(--line)}
.song-row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 4px;cursor:pointer}
.song-row:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.song-row .t{font-weight:600;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-row .a{grid-column:1;color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.note{color:var(--muted);font-size:14px;margin-block:14px 0}
.empty{padding-block:18px 6px;color:var(--muted)}
.empty b{color:var(--fg)}

/* Song */
.song-head h1{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.2;margin:4px 0 2px;text-wrap:balance;letter-spacing:-.01em}
.song-head .by{color:var(--muted);margin:0}
.by-link{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:32px;color:var(--accent);font-weight:500;-webkit-tap-highlight-color:transparent}
.by-link span{font-size:1.2em;line-height:1}
.by-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.song-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.song-links{display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:10px}
.slink{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;padding:4px 0 2px;border-radius:12px;text-decoration:none;color:var(--muted);font:500 10.5px/1.15 var(--f-body);text-align:center;-webkit-tap-highlight-color:transparent}
.slink svg{width:36px;height:36px}
.slink.find{color:var(--fg)}
.slink.find span{color:var(--fg);font-weight:600}
.slink span{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slink:hover,.slink:active{background:var(--sunk)}
.slink:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (min-width:640px){.song-head{display:grid;grid-template-columns:1fr auto;column-gap:16px}.song-head>*{grid-column:1}.song-head .song-links{grid-column:2;grid-row:1/span 3;align-self:start;justify-content:flex-end;margin-top:6px;max-width:420px}}
.pill{font-size:13px;background:var(--sunk);border-radius:999px;padding:3px 10px;color:var(--fg)}
.pill b{font-family:var(--f-mono);color:var(--chord)}

.strip{display:flex;gap:8px;overflow-x:auto;padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{all:unset;box-sizing:border-box;flex:0 0 auto;width:84px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px 4px;text-align:center;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip .n{font:700 14px var(--f-mono);color:var(--chord);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .q{display:block;height:64px;line-height:64px;color:var(--muted);font-size:22px}

.sheet-body{font-family:var(--f-mono);font-size:var(--fs);line-height:1.4;white-space:pre;overflow-x:auto;padding-block:6px 12px}
.ln{min-height:1.4em}
.ln.ch{color:var(--chord);font-weight:700}
.ln.gap{min-height:.8em}
.ln.head{font-family:var(--f-body);font-weight:600;font-size:.82em;letter-spacing:.04em;color:var(--muted);margin-top:.5em}
button.c{all:unset;cursor:pointer;color:var(--chord);border-radius:4px;white-space:pre}
button.c:hover{background:var(--sunk)}
button.c:focus-visible{outline:2px solid var(--accent)}

/* Diagrams */
.dia{display:block;width:100%;height:auto;max-width:210px;margin-inline:auto}
.dia .fr{stroke:var(--grid);stroke-width:1.2}
.dia .st{stroke:var(--string);stroke-width:1.4}
.dia .nut{fill:var(--fg)}
.dia .dot{fill:var(--fg)}
.dia .open{fill:none;stroke:var(--fg);stroke-width:1.8}
.dia text{font-family:var(--f-mono);font-weight:700}
.dia .fg{fill:var(--surface);font-size:12px}
.dia .mute{fill:var(--muted);font-size:16px;font-weight:400}
.dia .pos{fill:var(--muted);font-size:13px}
.dia.mini .fg{display:none}
.dia.mini .mute{font-size:20px}

/* Toolbar */
.tools{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.tools-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:12px;padding:3px}
.grp .lbl{font:700 13px var(--f-mono);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.grp .cap{font-size:11px;color:var(--muted);padding-inline:6px 2px;letter-spacing:.03em}
.grp button{background:transparent;border:0;min-width:36px;height:36px;border-radius:9px;color:var(--fg);font:600 15px var(--f-body);display:inline-flex;align-items:center;justify-content:center}
.grp button.on{background:var(--accent);color:var(--on-accent)}
.grp button svg{width:16px;height:16px;fill:currentColor}
.grp.scroll{flex:1 1 220px}
.speed{display:flex;align-items:center;gap:4px;flex:1;min-width:0;padding-inline-end:6px}
.speed .cap{padding:0;font-size:10px}
.speed input{flex:1;min-width:80px;width:auto;padding:0;border:0;background:transparent;accent-color:var(--accent);height:36px}

/* Editor */
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 120px;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.hint code{font-family:var(--f-mono);color:var(--chord);background:var(--sunk);border-radius:4px;padding:0 4px}
.err{color:var(--danger);font-size:13px;min-height:0}

/* Bottom sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.panel h2{font-family:var(--f-mono);font-size:26px;color:var(--chord);margin:0}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.var{background:var(--bg);border-radius:12px;padding:8px 10px 10px}
.var .l{font-size:12px;font-weight:600;text-align:center;margin-top:4px}
.one{padding-block:8px 4px}
.ctones{display:flex;gap:6px;margin:2px 0 10px}
.ctones span{min-width:34px;height:34px;padding:0 6px;border-radius:17px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 14px var(--f-body)}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 8px}
.var{display:flex;flex-direction:column;align-items:center;gap:2px}
.var-play{all:unset;box-sizing:border-box;width:100%;cursor:pointer;border-radius:12px;padding:6px 2px 4px;border:1px solid var(--line);background:var(--surface)}
.var-play:active,.var-play:hover{background:var(--sunk)}
.var-play:focus-visible{outline:2px solid var(--accent)}
.var-play .dia{max-width:150px}
.snotes{display:block;width:100%;max-width:150px;margin:0 auto}
.snotes text{fill:var(--muted);font:600 11px var(--f-body)}
.var-lbl{font-size:11px;color:var(--muted);text-align:center}
.one .dia{max-width:240px}
.one .info{font:14px/1.6 var(--f-mono);color:var(--muted);text-align:center;margin-top:10px}
.var .info{font:12px/1.5 var(--f-mono);color:var(--muted);text-align:center;margin-top:4px}
.panel p{margin:6px 0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:7px 2px 5px;border:0;background:none;color:var(--muted);font:500 11.5px var(--f-body);-webkit-tap-highlight-color:transparent;cursor:pointer}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] span{color:var(--fg);font-weight:600}
.tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px}
body:has(.tabbar) .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:3px;margin-block:2px 12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;min-height:38px;font:600 14px var(--f-body);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.wrap.wide{max-width:920px}
.chart-sum p{margin:0 0 8px;color:var(--muted);font-size:14px;max-width:65ch}
.sum-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.warn-line{color:var(--warn);font-weight:600}
.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:var(--warn)}
.link:focus-visible{outline:2px solid var(--accent)}
.chart-scroll{padding-block:0 10px}
.chart-root{font:700 16px var(--f-display);color:var(--accent);margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.chart-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
.cell{all:unset;box-sizing:border-box;position:relative;cursor:pointer;text-align:center;border-radius:10px;padding:4px 2px 2px;border:1.5px solid transparent}
.cell:hover{background:var(--sunk)}
.cell:focus-visible{outline:2px solid var(--accent)}
.cell .n{display:block;font:700 13px var(--f-body);white-space:nowrap}
.cell.flag{border-color:var(--warn);background:var(--warn-bg)}
.cell.done .n{color:var(--good)}
.cell .badge,.cell .tick{position:absolute;top:2px;right:3px;width:16px;height:16px;border-radius:50%;font:700 11px/16px var(--f-body);text-align:center}
.cell .badge{background:var(--warn);color:var(--surface)}
.cell .tick{background:var(--good);color:var(--surface)}
.cell.flag.done .tick{right:21px}
.verdict{font-size:14px;border-radius:10px;padding:10px 12px;margin-top:10px}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.bad{background:var(--warn-bg);color:var(--warn)}

.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:4px}
.skin{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;border:2px solid var(--line);overflow:hidden;background:var(--surface)}
.skin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin .sw{display:flex;flex-direction:column;justify-content:center;gap:3px;height:64px;padding:0 12px;font-family:var(--f-mono)}
.skin .sw b{font-size:15px}
.skin .sw i{font-style:normal;font-size:11px;opacity:.8;font-family:var(--f-body)}
.skin .nm{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:13px;font-weight:600}
.skin .nm span{color:var(--accent);font-size:15px}
.tabs button{padding-inline:2px;font-size:13.5px}
.sc-ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin-bottom:10px}
.sc-ctrl .field:first-child{flex:0 1 260px}
.sc-ctrl .field:last-child{flex:1 1 320px}
.roots{display:flex;flex-wrap:wrap;gap:4px}
.roots button{min-width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body)}
.roots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-block:6px 8px}
.sc-head h2{font-family:var(--f-display);font-size:19px;margin:0;text-wrap:balance}
.notes span.r{background:var(--accent);border-color:var(--accent)}
.notes span.r b,.notes span.r i{color:var(--on-accent)}
.notes span.bl{border-color:var(--chord);border-style:dashed}
.pos{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pos .seg button{padding:6px 10px}
.fb-scroll{overflow-x:auto;margin-inline:-16px;padding:10px 16px 4px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.fb{display:block}
.fb .fret{stroke:var(--string);stroke-width:2}
.fb .nut{stroke:var(--fg);stroke-width:6}
.fb .str{stroke:var(--muted)}
.fb .inlay{fill:var(--sunk)}
.fb .boxbg{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.fb .sname,.fb .fnum{fill:var(--muted);font:600 12px var(--f-mono)}
.fb .dot circle{fill:var(--surface);stroke:var(--chord);stroke-width:2}
.fb .dot text{fill:var(--chord);font:700 11px var(--f-body)}
.fb .dot.root circle{fill:var(--accent);stroke:var(--accent)}
.fb .dot.root text{fill:var(--on-accent)}
.fb .dot.blue circle{fill:var(--sunk);stroke-dasharray:3 2}
.fb .dot.dim{opacity:.18}
.fb .dot{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fb .dot:hover circle{stroke-width:3}
.fb .dot.hit circle{animation:hit .35s ease-out}
.fb .dot.sounding{opacity:1}
.fb .dot.sounding circle{fill:var(--accent);stroke:var(--accent);transform-box:fill-box;transform-origin:center;animation:sounding .3s ease-out}
.fb .dot.sounding text{fill:var(--on-accent)}
@keyframes sounding{0%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes hit{0%{stroke-width:7}100%{stroke-width:2}}
.pos .btn svg{fill:currentColor;stroke:none;width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.fb .dot.hit circle{animation:none}}
.cof-wrap{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start;justify-content:center}
#cof-svg{flex:0 1 380px;min-width:0;max-width:420px;width:100%}
.cof{display:block;width:100%;height:auto;touch-action:manipulation}
.cof .key{cursor:pointer;outline:none}
.cof .w{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .2s}
.cof .w.dia{fill:var(--sunk)}
.cof .w.dia{fill:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.cof .w.tonic{fill:var(--accent)}
.cof .key:hover .w:not(.tonic){fill:var(--sunk)}
.cof .key:focus-visible .w{stroke:var(--accent);stroke-width:3}
.cof text{pointer-events:none;fill:var(--fg)}
.cof .maj{font:700 18px var(--f-body)}
.cof .min{font:600 13px var(--f-body)}
.cof .alt{font:500 10px var(--f-body);fill:var(--muted)}
.cof .sig{font:600 9px var(--f-mono);fill:var(--muted)}
.cof .key:has(.tonic) text{fill:var(--on-accent)}
.cof .hubc{fill:var(--sunk)}
.cof .hub1{font:700 26px var(--f-display);fill:var(--accent)}
.cof .hub2{font:500 12px var(--f-body);fill:var(--muted)}
.cof-info{flex:1 1 300px;min-width:0;max-width:520px}
.cof-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cof-head h2{font-family:var(--f-display);font-size:22px;margin:0}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font:600 13px var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.cof-meta{color:var(--muted);font-size:14px;margin:6px 0 0}
.link2{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes span{display:flex;flex-direction:column;align-items:center;min-width:40px;padding:6px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.notes b{font:700 16px var(--f-mono)}
.notes i{font-style:normal;font-size:11px;color:var(--muted)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:stretch;border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:border-color .15s,background .15s}
.cchip .cplay{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:48px;padding:6px 6px 6px 8px}
.cchip .cdia{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:26px;border-left:1px solid var(--line);color:var(--muted)}
.cchip .cdia svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.cchip .cplay:hover,.cchip .cdia:hover{background:var(--sunk)}
.cchip .cplay:focus-visible,.cchip .cdia:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cchip.playing{border-color:var(--accent);background:var(--sunk)}
.cchip.playing{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.pplay{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);margin-right:4px;flex:0 0 auto}
.pplay svg{width:14px;height:14px;fill:currentColor}
.pplay:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.panel-top .play-btn{margin-left:auto}
.play-btn svg{fill:currentColor;stroke:none}
.cchip .rn{font:600 11px var(--f-body);color:var(--muted)}
.cchip .cn{font:700 15px var(--f-mono);color:var(--chord)}
.cchip.harm{border-style:dashed}
.progs{display:flex;flex-direction:column;gap:8px}
.prog{display:flex;flex-wrap:nowrap;align-items:center;gap:3px}
.prog .arr{color:var(--muted);font-size:11px;flex:none}
.prog .cchip{flex:1 1 0;min-width:0}
.prog .cchip .cplay{min-width:0;flex:1;padding:4px 2px 4px 4px}
.prog .cchip .cdia{width:18px}
.prog .cchip .cdia svg{width:11px;height:11px}
.prog .cchip .cn{font-size:13px;white-space:nowrap}
.prog .cchip .rn{font-size:10px}
.prog .pplay{width:30px;height:30px;margin-right:2px}
.tuner{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:8px 20px;--t-col:var(--muted)}
.tuner[data-state="ok"]{--t-col:var(--good)}
.tuner[data-state="near"]{--t-col:var(--accent)}
.tuner[data-state="off"]{--t-col:var(--warn)}
/* The meter is a dark instrument panel in every theme, by design; only the status colours come from the theme */
.tpanel{width:100%;max-width:520px;border-radius:16px;overflow:hidden;background:linear-gradient(170deg,var(--surface) 0%,var(--sunk) 100%);border:1px solid var(--line);
  box-shadow:0 10px 28px var(--shadow,rgba(0,0,0,.2));--p-ink:var(--muted);--p-tick:var(--muted);--p-needle:var(--fg);--p-ok:var(--good);--p-near:var(--accent)}
.tuner[data-state="ok"] .tpanel{--p-needle:var(--p-ok)}
.tuner[data-state="near"] .tpanel{--p-needle:var(--p-near)}
.gauge{width:100%;height:auto;display:block}
.gauge .sheen{fill:url(#sheen)}
.gauge .band{fill:none;stroke:var(--sunk);stroke-width:16}
.gauge .zone{fill:none;stroke:var(--good);stroke-opacity:.3;stroke-width:16}
.gauge .tm{stroke:var(--p-tick);stroke-opacity:.55;stroke-width:1.5}
.gauge .tM{stroke:var(--p-ink);stroke-width:2}
.gauge .lab{fill:var(--p-ink);font:500 13px var(--f-body)}
.gauge .cap{fill:none;stroke:var(--line);stroke-width:2}
.gauge .read{fill:var(--muted);font:500 16px var(--f-body);font-variant-numeric:tabular-nums}
.tuner[data-state="ok"] .gauge #t-cents{fill:var(--p-ok)}
.gauge .note{fill:var(--fg);font:700 30px var(--f-display)}
.gauge .note .oct{font-size:13px;font-weight:500;fill:var(--muted)}
.gauge .needle{stroke:var(--p-needle);stroke-width:2.5;stroke-linecap:round;transition:stroke .2s}
.t-status{font-weight:600;min-height:1.5em;color:var(--t-col);text-align:center}
.t-strings{display:flex;gap:8px;margin-top:4px}
.t-level{width:min(260px,70%);height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.t-level i{display:block;height:100%;width:0;background:var(--t-col,var(--accent));transition:width .08s linear}
.t-strings span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-body);background:var(--sunk);color:var(--muted);position:relative;transition:background .2s,color .2s}
.t-strings span sub{position:absolute;bottom:3px;right:7px;font-size:9px;font-weight:600}
.t-strings span.on{background:var(--t-col);color:var(--surface)}
.t-ref{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
.t-ref b{color:var(--fg);font-family:var(--f-mono);min-width:64px;text-align:center}
.tuner .verdict{max-width:60ch;text-align:center}
.t-help{width:100%;max-width:520px}
/* segmented rows (tuner views, chord practice) */
.pc-seg{display:flex;gap:2px;padding:3px;margin:0 auto 8px;max-width:560px;border-radius:10px;background:var(--sunk)}
.pc-seg button{flex:1;min-width:0;min-height:40px;padding:0 2px;border:0;border-radius:8px;background:none;color:var(--fg);font:500 14px var(--f-body);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pc-seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.pc-seg button:disabled{color:var(--muted);opacity:.45;cursor:default}
.pc-seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tu-seg{margin-bottom:14px}
/* strings view */
.tu-tun{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--accent);font:600 16px var(--f-body)}
.tu-tun select{border:0;background:none;color:var(--accent);font:700 17px var(--f-body);padding:4px 2px;width:auto;-webkit-appearance:none;appearance:none;text-align:center;cursor:pointer}
.tu-tun span{color:var(--muted);font-weight:500;font-size:14px}
.tu-tun::after{content:'';width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateY(-2px) rotate(45deg);order:1}
.tstr{display:flex;justify-content:space-between;width:100%;max-width:520px;height:min(50vh,440px);margin:8px 0}
.ts{position:relative;flex:1;display:flex;justify-content:center;align-items:center}
.ts-line{position:absolute;top:0;bottom:0;width:10px;border-radius:5px;background:color-mix(in srgb,var(--accent) 25%,var(--sunk));transition:background .2s}
.ts-lbl{position:relative;z-index:1;width:clamp(42px,12vw,56px);height:clamp(42px,12vw,56px);box-sizing:border-box;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:6px solid color-mix(in srgb,var(--accent) 25%,var(--sunk));color:var(--muted);font:700 17px var(--f-body);transition:border-color .2s,background .2s,color .2s}
.ts-dot{position:absolute;z-index:2;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--t-col);border:4px solid var(--surface);box-shadow:0 2px 6px var(--shadow,rgba(0,0,0,.25));opacity:0;transition:opacity .2s}
.ts.on .ts-line{background:var(--t-col)}
.ts.on .ts-lbl{border-color:var(--t-col);color:var(--t-col)}
.ts.on .ts-dot{opacity:1}
.ts.ok .ts-lbl{background:var(--good);border-color:var(--good);color:var(--surface)}
.ts.ok .ts-dot{opacity:0}
.tuner[data-state="idle"] .ts.on .ts-dot,.tuner[data-state="listen"] .ts-dot{opacity:0}
.t-snote{min-height:1.3em;color:var(--muted);font:600 15px var(--f-body);text-align:center}
/* chord practice */
.pc{max-width:560px;margin:0 auto}
.pc-types button{font-size:13px}
.pc-dia{display:flex;justify-content:center;margin:12px 0 6px}
.pc-dia .dia{max-width:280px}
.pc-res{text-align:center;font:600 16px var(--f-body);min-height:1.6em;color:var(--muted)}
.pc-res.ok,.pc-res.bad{font:700 21px var(--f-display)}
.pc-res.ok{color:var(--good)}
.pc-res.bad{color:var(--warn)}
.pc-notes{display:flex;justify-content:center;gap:6px;margin:8px 0 4px}
.pc-notes span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font:700 14px var(--f-body);transition:background .15s,color .15s}
.pc-notes span.heard{background:var(--good);color:var(--surface)}
.pc-notes span.mute{background:none}
.t-help .verdict{text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);font-size:15px;line-height:1.5}
.t-help ol{margin:6px 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.t-help .t-alt{color:var(--muted);font-size:13px}
.tuner .verdict a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.gauge .needle{transition:none}}
.grow{flex:1;min-width:0}
.seg.vt{padding:2px;gap:2px}
.seg.vt button{width:38px;height:34px;padding:0;display:grid;place-items:center;color:var(--muted)}
.seg.vt button[aria-pressed="true"]{color:var(--accent)}
.seg.vt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

<script>
/* ---------- music theory ---------- */
const SPEED_MIN=3,SPEED_MAX=70; // autoscroll, pixels per second (the old slowest step was 12)
const NS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NFL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
function noteIndex(n){let i=BASE[n[0]];if(n[1]==='#')i++;else if(n[1]==='b')i--;return (i+12)%12}
const CHORD_RE=/^([A-H])([#b]?)([^\/\s]*)(?:\/([A-H][#b]?))?$/;
const QUAL_OK=/^(?:maj|min|m|M|dim|aug|sus|add|no|[0-9]|b|#|\+|°|ø|Δ|\(|\)|-|o)*$/;
function parseChord(t){
  const m=CHORD_RE.exec(t); if(!m||!QUAL_OK.test(m[3]))return null;
  return {txt:t,root:noteIndex(m[1]+m[2]),q:m[3],bass:m[4]?noteIndex(m[4]):null};
}
function chordTok(t){
  let c=parseChord(t); if(c)return {pre:'',c,post:''};
  // decorated chords: (Am), /*D*/, *G*, [C], {Em}, |F|
  const m=/^([(\[{*\/|<~.-]*)(.*?)([)\]}*\/|>~.,-]*)$/.exec(t);
  if(m&&(m[1]||m[3])&&m[2]){c=parseChord(m[2]); if(c)return {pre:m[1],c,post:m[3]}}
  return null;
}
function chordName(c,shift,flats){
  if(!shift)return c.txt;
  const N=flats?NFL:NS;
  return N[(c.root+shift+120)%12]+c.q+(c.bass!=null?'/'+N[(c.bass+shift+120)%12]:'');
}
const QMAP={'':'maj','M':'maj','maj':'maj','m':'m','min':'m','-':'m','7':'7','m7':'m7','min7':'m7','-7':'m7',
  'maj7':'maj7','M7':'maj7','Δ':'maj7','Δ7':'maj7','sus2':'sus2','2':'sus2','sus4':'sus4','sus':'sus4','4':'sus4',
  'dim':'dim','°':'dim','o':'dim','dim7':'dim7','°7':'dim7','o7':'dim7','aug':'aug','+':'aug','6':'6','m6':'m6',
  '9':'9','add9':'add9','5':'5','7sus4':'7sus4','7sus':'7sus4','m7b5':'m7b5','ø':'m7b5','m7-5':'m7b5','ø7':'m7b5'};
function normQ(q){
  q=q.replace(/[()]/g,'');
  if(q in QMAP)return {q:QMAP[q],approx:false};
  let r='maj';
  if(/^(maj|M|Δ)/.test(q))r='maj7';
  else if(/^(m|min|-)/.test(q))r=/\d/.test(q)?'m7':'m';
  else if(/^sus/.test(q))r='sus4';
  else if(/^(dim|°|o)/.test(q))r='dim';
  else if(/^(aug|\+)/.test(q))r='aug';
  else if(/^(7|9|11|13)/.test(q))r='7';
  return {q:r,approx:true};
}

const OPEN_RAW={C:'x32010',C7:'x32310',Cmaj7:'x32000',Cadd9:'x32030',Csus4:'x33011',Csus2:'x30013',C6:'x32210',
  D:'xx0232',Dm:'xx0231',D7:'xx0212',Dm7:'xx0211',Dmaj7:'xx0222',Dsus2:'xx0230',Dsus4:'xx0233',D6:'xx0202',Ddim:'xx0131',

const META_LINE=/^(?:tuning|key|capo|difficulty|author|strumming|tempo|bpm|строй|тональность|каподастр)\s*:/i;
/* a chord-shape legend line such as "G  3-5-5-4-3-3" or "Am x02210" */
function shapeDef(line){
  const m=/^\s*(\S+)\s+((?:[xX\d]{1,2}[-\s]+){5}[xX\d]{1,2}|[xX\d]{6})\s*$/.exec(line);
  if(!m||!chordTok(m[1]))return null;
  const parts=/[-\s]/.test(m[2])?m[2].split(/[-\s]+/):[...m[2]];
  const frets=parts.map(p=>/x/i.test(p)?-1:+p);
  return frets.length===6&&frets.every(f=>f>=-1&&f<=22)?{name:m[1],frets}:null;
}
function importParse(raw){
  const text=raw.replace(/\r/g,'').replace(/ /g,' ').replace(/\[\/?(?:ch|tab)\]/gi,'');
  const lines=[];
  // "…EKey: GCapo: …" arrives glued together when a page is copied
  const unglued=text.replace(/([^\n])(?=(?:Tuning|Key|Capo|Difficulty|Author|Strumming|Tempo|BPM)\s*:)/g,'$1\n');
  for(const raw of unglued.split('\n')){
    const l=expandTabs(raw).replace(/\s+$/,''),m=l.trim().match(SEC_INLINE);
    if(m&&isChordLine(m[2])){lines.push(m[1]+':',m[2])}else lines.push(l);
  }
  let title='',artist='',m;
  const top=lines.slice(0,120);
  for(let i=0;i<top.length&&!title;i++){
    const t=top[i].trim(); if(!t)continue;
    if((m=t.match(/^(.+?)\s+(?:chords|tabs?|ukulele chords)\s+by\s+(.+)$/i))){title=m[1];artist=m[2]}
    else if((m=t.match(/^аккорды(?: и текст)?(?: песни)?\s+[«"]?(.+?)[»"]?\s+[-–—]\s+(.+)$/i))){title=m[1];artist=m[2]}
    else if((m=t.match(/^(.+?)\s+[-–—]\s+(.+?)[,.]?\s+(?:аккорды|chords)(?![\p{L}])/iu))){artist=m[1];title=m[2]}
    else if((m=t.match(/^(.{1,80}?)\s+(?:chords|tabs?|ukulele chords)$/i))&&!chordTok(m[1])){
      // newer page layout: "Song Chords" on one line, the artist (sometimes "by Artist") on the next
      title=m[1];
      for(let j=i+1;j<Math.min(top.length,i+4);j++){const n=top[j].trim();if(!n)continue;
        if(n.length<=60&&!JUNK.test(n)&&!META_LINE.test(n)&&!isChordLine(n))artist=n;break}
    }
  }
  title=cleanTitle(title); artist=cleanArtist(artist);
  const cm=text.match(/capo[:\s]*(?:on\s*)?(\d{1,2})|каподастр\w*[^\d\n]{0,20}(\d{1,2})/i);
  const capo=cm?Math.min(12,+(cm[1]||cm[2])):0;
  const isHead=t=>SEC.test(t)||(/^\[[^\]]+\]$/.test(t)&&!chordTok(t.slice(1,-1).trim()));
  const defs=[];
  const kind=lines.map(l=>{const t=l.trim();
    if(!t)return 'blank'; if(isHead(t))return 'head'; if(JUNK.test(t)||META_LINE.test(t))return 'junk';
    const d=shapeDef(l); if(d){if(!defs.some(x=>x.name===d.name))defs.push(d);return 'junk'}
    if(isChordLine(l)||(l.includes('[')&&inlineToPair(l)))return 'chord'; return 'text'});
  const nextText=i=>{let seen=0;for(let j=i+1;j<lines.length&&seen<3;j++){if(kind[j]==='blank')continue;seen++;if(kind[j]==='text')return true;if(kind[j]==='junk')return false}return false};
  let start=kind.indexOf('head');
  const firstChord=kind.findIndex((k,i)=>k==='chord'&&nextText(i));
  if(start<0||(firstChord>=0&&firstChord<start&&kind.slice(firstChord,start).every(k=>k!=='junk')))start=firstChord;
  if(start<0)return {title,artist,capo,defs,body:'',chordLines:0,parts:0};
  let end=start; kind.forEach((k,i)=>{if(i>=start&&(k==='chord'||k==='head'))end=i});
  for(let j=end+1,blank=0,n=0;j<lines.length&&n<14;j++,n++){
    if(kind[j]==='junk'||kind[j]==='chord')break;
    if(kind[j]==='blank'){if(++blank>=2)break;continue}
    blank=0;end=j;
  }
  const out=[];
  for(let i=start;i<=end;i++){
    const k=kind[i],t=lines[i].trim();
    if(k==='junk')continue;
    if(k==='blank'){if(out.length&&out[out.length-1]!=='')out.push('');continue}
    if(k==='head'){out.push(t.startsWith('[')?t:'['+t.replace(/:$/,'')+']');continue}
    out.push(lines[i]);
  }
  while(out.length&&out[out.length-1]==='')out.pop();
  return {title,artist,capo,defs,body:out.join('\n'),
    chordLines:kind.filter((k,i)=>k==='chord'&&i>=start&&i<=end).length,parts:kind.filter((k,i)=>k==='head'&&i>=start&&i<=end).length};
}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfReady=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
function loadPdfJs(){
  if(!pdfReady)pdfReady=(async()=>{
    await loadScript(PDFJS+'pdf.worker.min.js'); // runs on the page itself: the frame cannot start a worker from another site
    await loadScript(PDFJS+'pdf.min.js');

    return window.pdfjsLib;
  })().catch(e=>{pdfReady=null;throw e});

const PDF_NOISE=/^\s*(?:(?:page|стр\.?|страница)\s*)?\d+\s*(?:\/|of|из)\s*\d+\s*$|https?:\/\/|www\.|ultimate-guitar|\.(?:com|ru|net|org)\b/i;
async function pdfToText(lib,buf){
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const pages=[],widths=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const items=tc.items.filter(it=>typeof it.str==='string'&&it.str.trim()).map(it=>({s:it.str.replace(/\s+$/,''),x:it.transform[4],y:it.transform[5],w:it.width,h:Math.hypot(it.transform[2],it.transform[3])||it.height||10}));
    for(const it of items){const n=it.s.length;if(n&&it.w>0)widths.push(it.w/n)}
    pages.push(items);
  }
  const all=pages.flat(); if(!all.length)return '';
  widths.sort((a,b)=>a-b);
  const cw=widths[Math.floor(widths.length/2)]||6, minX=Math.min(...all.map(i=>i.x));
  const out=[];
  for(const items of pages){
    const rows=[];
    for(const it of items.sort((a,b)=>b.y-a.y||a.x-b.x)){
      let r=rows.find(r=>Math.abs(r.y-it.y)<Math.max(2,it.h*.3));
      if(!r){r={y:it.y,its:[]};rows.push(r)}
      r.its.push(it);
    }
    rows.sort((a,b)=>b.y-a.y);
    const steps=rows.slice(1).map((r,i)=>rows[i].y-r.y).sort((a,b)=>a-b);
    const lh=steps.length?steps[Math.floor(steps.length*.25)]:14;
    rows.forEach((r,i)=>{
      if(i>0){const extra=Math.min(2,Math.round((rows[i-1].y-r.y)/lh)-1);for(let k=0;k<extra;k++)out.push('')}
      let line='';
      for(const it of r.its.sort((a,b)=>a.x-b.x)){
        const col=Math.max(0,Math.round((it.x-minX)/cw));
        const at=!line.length?col:col>=line.length?col:line.length+1;
        line=line.padEnd(at,' ')+it.s;
      }
      if(!PDF_NOISE.test(line))out.push(line.replace(/\s+$/,''));
    });
    out.push('');
  }
  return out.join('\n');
}
function nameFromFile(fn){
  const parts=fn.replace(/\.pdf$/i,'').replace(/_/g,' ').split(/\s+[-–—]\s+/).map(s=>s.trim()).filter(Boolean);
  while(parts.length>1&&/^(chords?|tabs?|аккорды|ukulele.*)$/i.test(parts[parts.length-1]))parts.pop();
  return parts.length>=2?{artist:cleanArtist(parts[0]),title:cleanTitle(parts.slice(1).join(' - '))}:{artist:'',title:cleanTitle(parts[0]||'')};
}
const usesFlats=body=>/(^|[\s\[(\/])[A-H]b(?![a-zа-я])/m.test(body||'');
function chordLineHtml(s,shift,flats,seen){
  let out='',html=''; const re=/\S+/g; let m;
  while((m=re.exec(s))){
    const tk=chordTok(m[0]); let disp=m[0],name=null;
    if(tk){name=chordName(tk.c,shift,flats);disp=tk.pre+name+tk.post;if(seen&&!seen.includes(name))seen.push(name)}
    const target=out.length?Math.max(m.index,out.length+1):m.index;
    const pad=' '.repeat(Math.max(0,target-out.length));
    html+=pad+(name?`<button class="c" data-act="chord" data-c="${esc(name)}">${esc(disp)}</button>`:esc(disp));

  }

}
function songChords(song,shift){
  const seen=[],flats=usesFlats(song.body);

function localStore(){
  const read=()=>{try{return JSON.parse(lsGet('sb.songs')||'[]')}catch{return []}};
  let cb=()=>{};
  const write=a=>{lsSet('sb.songs',JSON.stringify(a));cb(a)};
  return {
    subscribe(f){cb=f;f(read())},
    async save(s){const a=read().filter(x=>x.id!==s.id);a.push(s);write(a)},
    async patch(id,p){write(read().map(x=>x.id===id?{...x,...p}:x))},
    async remove(id){write(read().filter(x=>x.id!==id))}
  };
}
async function initStore(){
  try{
    if(window.claude&&window.claude.use){
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const uid=user?await user.id():null;
      if(db&&uid){
        const col=db.collection('data/users/'+uid);
        S.mode='cloud';
        return {
          subscribe(f){col.onSnapshot(snap=>f(snap.docs.map(d=>({...d.data(),id:d.id}))),e=>toast('Связь с хранилищем потеряна. Обновите страницу.'))},
          save(s){const {id,...rest}=s;return col.doc(id).set(rest)},
          patch(id,p){return col.doc(id).update(p)},
          remove(id){return col.doc(id).delete()}
        };
      }
    }
  }catch{}
  S.mode='local';
  return localStore();
}

/* ---------- circle of fifths ---------- */
const COF_MAJ=['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
const COF_MAJ_ALT={5:'Cb',6:'Gb',7:'C#'};
const COF_MIN=['A','E','B','F#','C#','G#','D#','Bb','F','C','G','D'];
const COF_MIN_ALT={6:'Eb',7:'A#'};
const LET=['C','D','E','F','G','A','B'],LPC=[0,2,4,5,7,9,11];
function spellScale(root,steps){
  const li=LET.indexOf(root[0]),rpc=noteIndex(root);
  return steps.map((st,k)=>{
    const L=LET[(li+k)%7]; let diff=(((rpc+st)%12-LPC[LET.indexOf(L)])%12+12)%12; if(diff>6)diff-=12;
    return L+(diff>0?'#'.repeat(diff):'b'.repeat(-diff));
  });
}
const MODES={
  major:{steps:[0,2,4,5,7,9,11],q:['','m','m','','','m','dim'],rn:['I','ii','iii','IV','V','vi','vii°'],
    prog:[['I','V','vi','IV'],['I','vi','IV','V'],['ii','V','I'],['I','IV','V','I'],['vi','IV','I','V']]},
  minor:{steps:[0,2,3,5,7,8,10],q:['m','dim','','m','m','',''],rn:['i','ii°','III','iv','v','VI','VII'],
    prog:[['i','iv','v','i'],['i','VI','III','VII'],['i','VII','VI','VII'],['ii°','V7','i'],['i','iv','V7','i']]}
};
const cofState=(()=>{try{const v=JSON.parse(lsGet('sb.cof')||'{}');return {i:(v.i>=0&&v.i<12)?v.i:0,minor:!!v.minor}}catch{return {i:0,minor:false}}})();
function cofKey(){
  const {i,minor}=cofState,m=minor?MODES.minor:MODES.major,root=minor?COF_MIN[i]:COF_MAJ[i];
  const notes=spellScale(root,m.steps);
  const chords=notes.map((n,k)=>({rn:m.rn[k],name:n+m.q[k]}));
  // harmonic-minor dominant: same root as v, major third, plus the seventh
  if(minor)chords.push({rn:'V7',name:notes[4]+'7',harm:true});
  const byRn=Object.fromEntries(chords.map(c=>[c.rn,c.name]));
  return {root,notes,chords,byRn,prog:m.prog.map(p=>p.map(rn=>({rn,name:byRn[rn],harm:rn==='V7'})))};
}
function sigText(i){
  if(i===0)return 'без знаков';
  const sharps=['F#','C#','G#','D#','A#','E#'],flats=['Bb','Eb','Ab','Db','Gb','Cb'];
  if(i<=6){const n=i;return `${n} ${plural(n,'диез','диеза','диезов')}: ${sharps.slice(0,n).map(pretty2).join(' ')}`}

/* radix-2 FFT, in place */
function fftInPlace(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<len/2;k++){const a=i+k,b=a+len/2,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}
  }
}
/* one look at the sound: which of the chord's notes are there, and is anything else ringing */
function pcAnalyze(buf,sr,v){
  const N=buf.length; let e=0; for(let i=N-4096;i<N;i++)e+=buf[i]*buf[i];
  const lvl=Math.sqrt(e/4096); PC.floor=Math.min(0.004,PC.floor==null?Math.min(lvl,0.0008):lvl<PC.floor?PC.floor*0.8+lvl*0.2:PC.floor*0.998+lvl*0.002);
  if(lvl<Math.max(0.0012,PC.floor*2.5))return {quiet:true};
  const re=new Float32Array(N),im=new Float32Array(N);
  for(let i=0;i<N;i++)re[i]=buf[i]*(0.5-0.5*Math.cos(2*Math.PI*i/(N-1)));
  fftInPlace(re,im);
  const kmin=Math.floor(65*N/sr),kmax=Math.ceil(1600*N/sr),mag=new Float32Array(kmax+3);
  let mx=0; for(let k=kmin-2;k<=kmax+2;k++){mag[k]=Math.hypot(re[k],im[k]);if(k>=kmin&&k<=kmax&&mag[k]>mx)mx=mag[k]}
  const peaks=[];
  for(let k=kmin;k<=kmax;k++){
    const m=mag[k]; if(m<mx*0.08||m<=mag[k-1]||m<mag[k+1]||m<=mag[k-2]||m<mag[k+2])continue;
    const a=Math.log(mag[k-1]+1e-9),b=Math.log(m),c=Math.log(mag[k+1]+1e-9),d=a-2*b+c,off=d?0.5*(a-c)/d:0;
    peaks.push({f:(k+off)*sr/N,m});
  }
  peaks.sort((p,q)=>q.m-p.m); const top=peaks.slice(0,24);
  const exp=[...new Set(v.frets.map((x,i)=>x<0?null:STD[i]+x).filter(x=>x!=null))];
  const fq=m=>440*Math.pow(2,(m-69)/12),near=(f,g)=>Math.abs(1200*Math.log2(f/g))<45;
  const heard=new Set();
  for(const m of exp){const fe=fq(m);if(top.some(p=>near(p.f,fe)&&p.m>mx*0.06)||(m<55&&top.some(p=>(near(p.f,2*fe)||near(p.f,3*fe))&&p.m>mx*0.1)))heard.add(m)}
  const wrong=new Set();
  for(const p of top){
    if(p.m<mx*0.28)continue;
    const ok=exp.some(m=>{const fe=fq(m),h=Math.round(p.f/fe);return h>=1&&h<=8&&near(p.f,h*fe)});
    if(!ok){const mm=Math.round(69+12*Math.log2(p.f/440));wrong.add(((mm%12)+12)%12)}
  }
  const pcs=[...new Set(exp.map(m=>m%12))],heardPc=new Set([...heard].map(m=>m%12));
  const missing=pcs.filter(pc=>!heardPc.has(pc));
  return {heard,missing,wrong:[...wrong],ok:!missing.length&&!wrong.size};
}

/* YIN pitch detection on one frame of samples */
function detectPitch(buf,sr,gate){
  let rms=0; for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
  if(Math.sqrt(rms/buf.length)<(gate||0.0008))return null;
  const W=buf.length>>1,maxLag=Math.min(W-1,Math.floor(sr/60)),minLag=Math.floor(sr/1200);
  const d=new Float32Array(maxLag+1);
  for(let tau=1;tau<=maxLag;tau++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];s+=x*x}d[tau]=s}
  let run=0,tau=-1; const cm=new Float32Array(maxLag+1); cm[0]=1;
  for(let t=1;t<=maxLag;t++){run+=d[t];cm[t]=run?d[t]*t/run:1}
  for(let t=minLag;t<=maxLag;t++){if(cm[t]<0.12){while(t+1<=maxLag&&cm[t+1]<cm[t])t++;tau=t;break}}
  if(tau<0){let best=minLag;for(let t=minLag;t<=maxLag;t++)if(cm[t]<cm[best])best=t;if(cm[best]>0.3)return null;tau=best}
  const a=cm[tau-1]??cm[tau],b=cm[tau],c=cm[tau+1]??cm[tau],den=a-2*b+c;
  const t=den?tau+(a-c)/(2*den):tau;

}

    TU.an.getFloatTimeDomainData(TU.buf);
    let pk=0; for(let i=0;i<TU.buf.length;i+=4){const v=Math.abs(TU.buf[i]);if(v>pk)pk=v}
    TU.peak=Math.max(pk,TU.peak*0.85);
    const lv=document.getElementById('t-lvl'); if(lv)lv.style.width=Math.min(100,Math.round(Math.sqrt(TU.peak)*220))+'%';
    const now=performance.now();

function metroTap(){
  const now=performance.now();
  M.taps=M.taps.filter(t=>now-t<2500); M.taps.push(now);
  if(M.taps.length>6)M.taps.shift();
  if(M.taps.length>=2)metroSet(60000/((M.taps[M.taps.length-1]-M.taps[0])/(M.taps.length-1)));

/* ---------- a video at the end of a song: YouTube, Rutube or VK Video ---------- */
function videoInfo(url){
  url=(url||'').trim(); if(!url)return null;
  let m;
  if((m=url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/i)))
    return {kind:'youtube',name:'YouTube',url,embed:null};
  if((m=url.match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/i)))
    return {kind:'instagram',name:'Instagram',url,embed:'https://www.instagram.com/'+(m[1]==='p'?'p':'reel')+'/'+m[2]+'/embed/',tall:true};
  if((m=url.match(/rutube\.ru\/(?:video|play\/embed|shorts)\/([0-9a-f]{20,})/i)))
    return {kind:'rutube',name:'Rutube',url,embed:'https://rutube.ru/play/embed/'+m[1]};
  if((m=url.match(/(?:vk\.com|vkvideo\.ru|vk\.ru)\/(?:[^?#]*?)video(-?\d+)_(\d+)/i)))
    return {kind:'vk',name:'VK Видео',url,embed:'https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2]+'&hd=2'};
  if(/^https?:\/\//i.test(url))return {kind:'link',name:'видео',url,embed:null};
  return null;
}
const videoLinks=s=>String((s&&s.video)||'').split(/\s+/).filter(x=>/^https?:\/\//i.test(x));
function videoHtml(s){
  const list=videoLinks(s).map(videoInfo).filter(Boolean);
  if(!list.length)return '';
  const canEmbedHere=window.SONGBOOK_OFFLINE||!window.claude; // claude.ai pages cannot embed other sites
  const kinds=new Set(list.map(v=>v.kind));
  return `<section class="video" id="video">
    <h3 class="sec-h">${list.length>1?'Видео · '+list.length:'Видео'}</h3>
    <div class="vlist">${list.map((v,i)=>`<div class="vitem">
      ${v.embed&&canEmbedHere?`<div class="vframe${v.tall?' tall':''}" id="vframe-${i}"><button class="vplay" data-act="video-load" data-i="${i}" aria-label="Показать видео ${i+1}">${ICON.play}<span>Показать видео · ${esc(v.name)}</span></button></div>`:''}
      <div class="vlinks">${v.embed&&canEmbedHere?`<button class="btn" data-act="video-full" data-i="${i}">${ICON.stage}На весь экран</button>`:''}<a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">Открыть в ${esc(v.name)}</a></div>
    </div>`).join('')}</div>
    ${kinds.has('youtube')?'<p class="hint">Встроенный плеер YouTube в России подвисает и просит войти, поэтому для YouTube здесь только ссылка: она откроется в приложении YouTube.</p>':''}${kinds.has('instagram')?'<p class="hint">Instagram в России открывается только с VPN. Если видео не загрузилось, нажмите «Открыть в Instagram».</p>':''}
  </section>`;
}
/* Full screen for an embedded video: the real fullscreen API where the browser allows it (iPad, computer),
   and on iPhone, where it does not, the player is stretched over the whole screen */
function videoFull(i){
  const box=document.getElementById('vframe-'+i); if(!box)return;
  if(!box.querySelector('iframe'))loadVideo(i);
  box.classList.add('vfull'); document.body.classList.add('vfull-on');
  if(!box.querySelector('.vclose'))box.insertAdjacentHTML('beforeend','<button class="vclose" data-act="video-exit" aria-label="Свернуть видео">✕</button>');
  try{
    if(box.requestFullscreen)box.requestFullscreen().catch(()=>{});
    else if(box.webkitRequestFullscreen)box.webkitRequestFullscreen();
  }catch{}
}
function videoExit(){
  document.querySelectorAll('.vframe.vfull').forEach(b=>{b.classList.remove('vfull');const c=b.querySelector('.vclose');if(c)c.remove()});
  document.body.classList.remove('vfull-on');

    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});

}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.querySelector('.vframe.vfull'))videoExit()});

/* ---------- backing track ("минус"): the file stays on this device (IndexedDB); the song keeps its name, length and line marks ---------- */
const TR={el:null,url:'',id:null,has:false,raf:0,cur:-1,marking:false,marks:[],k:0,n:0,seeking:0,vOn:false,vStart:0,vPaused:0};
const hasMarks=()=>TR.marks.some(x=>x!=null);
const vEnd=()=>Math.max(0,...TR.marks.filter(x=>x!=null))+5;
const trackCan=()=>!!window.SONGBOOK_OFFLINE&&'indexedDB' in window;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('songbook-audio',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('tracks'))d.createObjectStore('tracks');if(!d.objectStoreNames.contains('gtp'))d.createObjectStore('gtp')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function trackGet(id){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('tracks').objectStore('tracks').get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch{return null}}
async function trackPut(id,rec){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('tracks','readwrite');t.objectStore('tracks').put(rec,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function trackDelete(id){try{const db=await idb();await new Promise(ok=>{const t=db.transaction('tracks','readwrite');t.objectStore('tracks').delete(id);t.oncomplete=ok;t.onerror=ok})}catch{}}
const fmtTime=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};

/* ---------- the minus as a waveform (like Logic): played part in the theme color, a playhead, line marks; tap or drag to seek ---------- */
const WAVE_N=800;
async function wavePeaks(id,rec){
  const key='sb.wave.'+id,sig=(rec.size||0)+':'+(rec.name||'');
  try{const c=JSON.parse(lsGet(key)||'null');if(c&&c.sig===sig&&Array.isArray(c.p)){TR.peaks=c.p;return}}catch{}
  try{
    const ab=rec.buf?rec.buf.slice(0):await rec.blob.arrayBuffer();
    const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,1,8000); // decoded at 8 kHz: enough for a picture, light on memory
    const au=await new Promise((ok,no)=>{const p=oc.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no)});
    const ch=au.getChannelData(0),step=Math.max(1,Math.floor(ch.length/WAVE_N)),p=[];
    let mx=0;
    for(let i=0;i<WAVE_N;i++){let m=0;const a=i*step,b=Math.min(ch.length,a+step);for(let j=a;j<b;j+=2){const v=Math.abs(ch[j]);if(v>m)m=v}p.push(m);if(m>mx)mx=m}
    const out=p.map(v=>Math.round(Math.min(1,v/(mx||1))*100)/100);
    if(TR.id===id){TR.peaks=out;drawWave()}
    lsSet(key,JSON.stringify({sig,p:out}));
  }catch{}
}
function drawWave(){
  const c=document.getElementById('t-wave'); if(!c||!TR.el)return;
  const w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1; if(!w||!h)return;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue('--accent').trim()||'#FFB648',dim=cs.getPropertyValue('--muted').trim()||'#888';
  const d=isFinite(TR.el.duration)?TR.el.duration:0,t=TR.el.currentTime||0,px=d?t/d*w:0;
  const P=TR.peaks,bw=3,n=Math.floor(w/bw);
  for(let i=0;i<n;i++){
    let v=0.06;
    if(P){const a=Math.floor(i/n*P.length),b=Math.max(a+1,Math.floor((i+1)/n*P.length));for(let j=a;j<b;j++)if(P[j]>v)v=P[j]}
    const bh=Math.max(2,v*(h-4)),x=i*bw;
    g.fillStyle=x<px?acc:dim; g.globalAlpha=x<px?1:0.45;
    g.fillRect(x,(h-bh)/2,bw-1,bh);
  }
  g.globalAlpha=1;
  if(d){ // line marks
    g.fillStyle=acc;
    g.globalAlpha=0.5; TR.marks.forEach(m=>{if(m!=null)g.fillRect(Math.round(m/d*w),0,1,3)}); g.globalAlpha=1; // where each marked line starts
    g.fillStyle=cs.getPropertyValue('--fg').trim()||'#fff'; g.fillRect(Math.round(px)-1,0,2,h); // playhead
  }
}
/* seeking on the waveform */
(()=>{
  let drag=false;
  const seek=e=>{const c=document.getElementById('t-wave');if(!c||!TR.el)return;const d=TR.el.duration;if(!isFinite(d)||!d)return;
    const r=c.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));
    TR.seeking=Date.now();TR.el.currentTime=x/r.width*d;TR.cur=-2;
    const tm=document.getElementById('t-time');if(tm)tm.textContent=fmtTime(TR.el.currentTime)+' / '+fmtTime(d);drawWave()};
  document.addEventListener('pointerdown',e=>{if(e.target.id!=='t-wave')return;drag=true;try{e.target.setPointerCapture(e.pointerId)}catch{}seek(e);e.preventDefault()});
  document.addEventListener('pointermove',e=>{if(drag)seek(e)});
  const up=()=>{drag=false};document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  addEventListener('resize',()=>drawWave());
})();
/* when the minus has no line marks the text glides with it; a finger or the wheel moves it freely and the glide carries on from there */
(()=>{
  const mark=e=>{if(S.view==='song'&&TR.el&&!TR.el.paused&&!(e.target.closest&&e.target.closest('#tools,.markbar,.sheet')))TR.userAt=performance.now()};
  document.addEventListener('touchstart',mark,{passive:true});document.addEventListener('touchmove',mark,{passive:true});document.addEventListener('wheel',mark,{passive:true});
})();

async function trackLoad(s){
  trackStop(); TR.id=s.id; TR.marks=Array.isArray(s.marks)?s.marks.slice():[]; TR.peaks=null; TR.glideOff=0;
  if(S.view==='song')renderTools();
  if(!trackCan()||!s.track)return;
  let rec=await trackGet(s.id);
  if(!rec&&s.track.path&&ghOn()&&navigator.onLine!==false){
    try{
      const buf=await ghGetRaw(s.track.path);
      const ext=(s.track.path.split('.').pop()||'').toLowerCase();
      rec={buf,type:AUDIO_TYPES[ext]||'audio/mp4',name:s.track.name,size:buf.byteLength,added:Date.now()};
      try{await trackPut(s.id,rec)}catch{}
      if(S.cur===s.id)toast('Минус скачан с GitHub');
    }catch{}
  }
  if(!rec||S.cur!==s.id||TR.id!==s.id)return;
  const a=new Audio(); TR.url=URL.createObjectURL(rec.blob||new Blob([rec.buf],{type:rec.type||'audio/mp4'}));
  a.preload='auto'; a.setAttribute('playsinline',''); a.src=TR.url;
  a.addEventListener('loadedmetadata',()=>{if(S.view==='song')renderTools()});
  // while the minus plays, keep the line-follow loop alive (iOS can drop it; this brings it back)
  const heal=()=>{if(TR.el===a&&!a.paused&&!TR.marking&&performance.now()-(TR.beat||0)>400){cancelAnimationFrame(TR.raf);TR.raf=requestAnimationFrame(trackFollow)}};
  a.addEventListener('playing',heal); a.addEventListener('timeupdate',heal);
  a.addEventListener('ended',()=>{if(TR.marking)markDone();renderTools()});
  a.addEventListener('pause',()=>{if(S.view==='song')renderTools()});
  TR.el=a; TR.has=true;
  if(S.view==='song')renderTools();
  wavePeaks(s.id,rec);
}
function trackStop(){
  if(TR.marking&&TR.k>0&&TR.id&&store){const now=Date.now(),o=TR.wordMode?wordMarksOut():TR.from?markMerged():{marks:TR.marks.slice(0,TR.k),wmarks:null};store.patch(TR.id,{marks:o.marks,wmarks:o.wmarks,marksAt:now,updatedAt:now}).catch(()=>{})}
  wordClear(); TR.wordMode=false;
  if(TR.el){try{TR.el.pause();TR.el.removeAttribute('src');TR.el.load()}catch{}}
  if(TR.url)URL.revokeObjectURL(TR.url);
  cancelAnimationFrame(TR.raf);
  const mb=document.getElementById('markbar'); if(mb)mb.remove();
  Object.assign(TR,{el:null,url:'',id:null,has:false,raf:0,cur:-1,marking:false,vOn:false,vPaused:0});
}
function trackTools(){
  if(!TR.has||!TR.el){
    if(!hasMarks()||TR.marking)return '';
    const t=TR.vOn?(performance.now()-TR.vStart)/1000:TR.vPaused;
    return `<div class="grp trackgrp" aria-label="Текст по разметке">
      <button data-act="v-play" class="${TR.vOn?'on':''}" aria-label="${TR.vOn?'Пауза':'Запустить текст по разметке'}">${TR.vOn?ICON.pause:ICON.play}</button>
      <span class="tt" id="t-time">${fmtTime(t)} / ${fmtTime(vEnd())}</span><span class="cap">по разметке</span>
      ${TR.vPaused&&!TR.vOn?'<button data-act="v-reset" aria-label="С начала">↺</button>':''}</div>`;
  }
  const d=isFinite(TR.el.duration)?TR.el.duration:0,t=TR.el.currentTime||0,on=!TR.el.paused;
  return `<div class="grp trackgrp" aria-label="Минус">
    <button data-act="t-play" class="${on?'on':''}" aria-label="${on?'Пауза':'Играть минус'}">${on?ICON.pause:ICON.play}</button>
    <span class="tt" id="t-time">${fmtTime(t)} / ${fmtTime(d)}</span>
    <canvas id="t-wave" class="wave" role="slider" aria-label="Минус: нажмите или проведите, чтобы перемотать" aria-valuemin="0" aria-valuemax="${Math.round(d)}" aria-valuenow="${Math.round(t)}"></canvas></div>`;
}
function trackToggle(){
  if(!TR.el)return;
  if(CI.on){countInStop();renderTools();return}
  if(TR.el.paused){
    stopAuto();
    TR.el.play().then(()=>{if(!TR.raf)TR.raf=requestAnimationFrame(trackFollow);renderTools()}).catch(()=>toast('Не получилось включить минус. Проверьте, что файл открывается в «Файлах».'));
  }else TR.el.pause();
}
/* each frame: update the clock, then either jump between marked lines or glide through the song */
function trackFollow(){
  const virt=!TR.el;
  if(virt?!TR.vOn:TR.el.paused){TR.raf=0;return}
  TR.raf=requestAnimationFrame(trackFollow); TR.beat=performance.now();
  const t=virt?(performance.now()-TR.vStart)/1000:TR.el.currentTime,d=virt?vEnd():(TR.el.duration||0);
  if(virt&&t>=d){vReset();return}
  const tm=document.getElementById('t-time'); if(tm)tm.textContent=fmtTime(t)+' / '+fmtTime(d);
  if(!virt)drawWave();
  if(TR.marking)return;
  if(TR.marks.some(x=>x!=null)){
    let i=-1; TR.marks.forEach((m,k)=>{if(m!=null&&m<=t+0.05)i=k});
    if(i!==TR.cur){TR.cur=i;lineHL(i,'cur',true)}
    wordFollow(t);
  }else if(d>0){
    const max=SCR.scrollHeight-SCR.clientHeight;
    if(max>0){
      const base=Math.round(max*Math.min(1,t/d));
      if(performance.now()-(TR.userAt||0)<1200)TR.glideOff=SCR.scrollTop-base; // the user is moving the text: remember where they put it
      else{const y=Math.max(0,Math.min(max,base+(TR.glideOff||0)));if(Math.abs(y-SCR.scrollTop)>1)SCR.scrollTo(0,y)}
    }
  }
}
function lineHL(li,cls,scroll){
  document.querySelectorAll('.ln.'+cls).forEach(e=>e.classList.remove(cls));
  if(li<0)return;
  const ly=document.querySelector(`.ln[data-li="${li}"]`); if(!ly)return;
  ly.classList.add(cls);
  document.querySelectorAll(`.ln[data-pli="${li}"]`).forEach(e=>e.classList.add(cls));
  if(scroll){const top=scrTop(ly)-SCR.clientHeight*0.35;SCR.scrollTo({top:Math.max(0,top),behavior:'smooth'})}
}
function vToggle(){
  if(TR.el||!hasMarks())return;
  if(TR.vOn){TR.vPaused=(performance.now()-TR.vStart)/1000;TR.vOn=false}
  else if(CI.on){countInStop()}
  else{stopAuto();TR.vStart=performance.now()-TR.vPaused*1000;TR.vOn=true;if(!TR.raf)TR.raf=requestAnimationFrame(trackFollow)}
  renderTools();
}
function vReset(){wordClear();TR.vOn=false;TR.vPaused=0;cancelAnimationFrame(TR.raf);TR.raf=0;TR.cur=-1;lineHL(-1,'cur');renderTools()}
const AUDIO_TYPES={m4a:'audio/mp4',mp3:'audio/mpeg',wav:'audio/wav',aac:'audio/aac',aif:'audio/aiff',aiff:'audio/aiff'};
/* After the app was removed and installed again: pick all minus files at once, they go back to their songs by name */
async function trackRestore(files){
  const want=new Map(); // file name → songs that use it
  S.songs.forEach(x=>{if(x.track&&x.track.name){const k=x.track.name.toLowerCase();if(!want.has(k))want.set(k,[]);want.get(k).push(x)}});
  let put=0,skip=0; toast('Восстанавливаю минусы…');
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch{}
  for(const file of files){
    const songs=want.get(file.name.toLowerCase());
    if(!songs){skip++;continue}
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    let buf; try{buf=await file.arrayBuffer()}catch{skip++;continue}
    for(const x of songs){
      try{await trackPut(x.id,{buf,type:file.type||AUDIO_TYPES[ext]||'audio/mp4',name:file.name,size:file.size,added:Date.now()});put++}
      catch(e){toast(e&&e.name==='QuotaExceededError'?'Не хватило места на устройстве.':'Не получилось сохранить «'+file.name+'».');fillRestore();return}
    }
  }
  toast(put?('Минусы на месте: '+put+(skip?'. Не подошли по имени: '+skip:'')):'Ни один файл не совпал по имени с минусами в песнях.');
  fillRestore();
  const cur=S.cur&&findSong(S.cur); if(cur&&S.view==='song')trackLoad(cur);
}
/* songs whose minus is known but missing on this device */
async function fillRestore(){
  const el=document.getElementById('restore'); if(!el)return;
  if(!trackCan()){el.hidden=true;return}
  const withTrack=S.songs.filter(x=>x.track&&x.track.name);
  const missing=[];
  for(const x of withTrack)if(!(await trackGet(x.id)))missing.push(x);
  if(!document.getElementById('restore'))return;
  el.hidden=false;

function tempoOf(env,fps){

function tempoListen(){

async function fileGet(store,id){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction(store).objectStore(store).get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch{return null}}
async function filePut(store,id,rec){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(rec,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function fileDel(store,id){try{const db=await idb();await new Promise(ok=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=ok;t.onerror=ok})}catch{}}
const GTP_EXT=/\.(gp|gp3|gp4|gp5|gpx|gp6|gp7|ptb)$/i;
const G={id:null,file:null}; // the open song's file, ready in memory so sharing starts straight from the tap
async function gtpLoad(s){
  G.id=s.id; G.file=null;
  if(!trackCan()||!s.gtp)return;
  let rec=await fileGet('gtp',s.id);
  if(!rec&&s.gtp.path)rec=await gtpFetch(s);
  if(rec&&G.id===s.id){G.file=new File([rec.buf],rec.name);if(S.cur===s.id&&S.view==='song')fillSong()}
}
async function gtpAdd(file){
  const s=findSong(S.cur); if(!s||s.demo)return;
  if(!GTP_EXT.test(file.name)){toast('Это не файл Guitar Pro. Подходят .gp, .gp3, .gp4, .gp5, .gpx и .ptb.');return}
  if(file.size>30*1024*1024){toast('Файл больше 30 МБ: для табулатуры это слишком много.');return}
  try{const buf=await file.arrayBuffer();await filePut('gtp',s.id,{buf,name:file.name,size:file.size,added:Date.now()})}
  catch(e){const n=e&&e.name||'';toast(n==='QuotaExceededError'?'Не хватило места на устройстве.':'Не получилось сохранить файл'+(n?' ('+n+')':'')+'.');return}
  try{await store.patch(s.id,{gtp:{name:file.name,size:file.size},updatedAt:Date.now()})}catch(e){saveErr(e);return}
  closeSheet(); await gtpLoad(findSong(s.id)); fillSong(); toast('GTP-файл добавлен');
  if(ghOn())gtpUpload(s.id);
}
function gtpDownload(f){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
/* iOS opens a file in another app only through the share sheet: pick Guitar Pro there */
function gtpOpen(){
  const s=findSong(S.cur); if(!s||!s.gtp)return;
  if(!G.file){
    sheet.innerHTML=`<div class="panel" role="dialog" aria-label="GTP-файл">
      <div class="panel-top"><h2 class="ptitle">GTP-файл</h2><button class="btn" data-act="close">Закрыть</button></div>
      <p class="hint">${!trackCan()?'GTP-файлы открываются в приложении с экрана «Домой».':s.gtp.path&&!ghOn()?`Файл «${esc(s.gtp.name)}» хранится на GitHub. Подключите синхронизацию с GitHub (Песни → внизу), и он скачается сам.`:s.gtp.path?`Не получилось скачать «${esc(s.gtp.name)}» с GitHub. Проверьте интернет и откройте песню снова, или выберите файл вручную.`:`Файл «${esc(s.gtp.name)}» добавлен на другом устройстве и ещё не загружен на GitHub. На том устройстве нажмите Песни → «Синхронизировать сейчас», или выберите файл здесь.`}</p>
      ${trackCan()?`<div class="menu">${gtpPicker('Выбрать GTP-файл')}</div>`:''}</div>`;
    sheet.hidden=false; return;
  }
  const f=G.file;
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:f.name}).catch(e=>{if(!e||e.name!=='AbortError')gtpDownload(f)});
    return;
  }
  gtpDownload(f);
}
async function gtpRemove(btn){
  if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.lastChild.textContent='Точно удалить GTP-файл?';return}
  const s=findSong(S.cur); if(!s)return;
  const ghPath=s.gtp&&s.gtp.path;
  await fileDel('gtp',s.id); G.file=null; gtpGhDelete(ghPath);
  try{await store.patch(s.id,{gtp:null,updatedAt:Date.now()})}catch(e){saveErr(e)}
  closeSheet(); fillSong(); toast('GTP-файл удалён');
}

/* ---------- Guitar Pro files also live in the GitHub repository, named after the song: gtp/<artist> - <title>.<ext>
   so a song deleted and added again finds its file by name ---------- */
function bufToB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function ghFileSha(path){try{return (await ghFetch('/contents/'+encPath(path)+'?ts='+Date.now())).sha}catch(e){if(e.status===404)return null;throw e}}
async function ghGetRaw(path){
  const r=await fetch('https://api.github.com/repos/'+GH.cfg.repo+'/contents/'+encPath(path)+'?ts='+Date.now(),{cache:'no-store',
    headers:{Authorization:'Bearer '+GH.cfg.token,Accept:'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'}});
  if(!r.ok){const e=new Error('github '+r.status);e.status=r.status;throw e}
  return r.arrayBuffer();
}
function gtpSlug(s){
  const base=[s.artist,s.title].map(x=>(x||'').trim()).filter(Boolean).join(' - ')||s.id;
  return base.toLowerCase().replace(/[\\/:*?"<>|#%\u0000-\u001f]/g,'').replace(/\s+/g,' ').trim().slice(0,90)||s.id;
}
const gtpExt=name=>((name||'').split('.').pop()||'gp').toLowerCase().replace(/[^a-z0-9]/g,'')||'gp';
const gtpPathFor=(s,name)=>'gtp/'+gtpSlug(s)+'.'+gtpExt(name);
const gtpBase=name=>name.toLowerCase().replace(/\.[^.]+$/,'');
/* the files in gtp/, listed at most once a minute */
async function gtpList(force){
  if(!ghOn())return [];
  if(!force&&GH.gtpList&&Date.now()-GH.gtpListAt<60000)return GH.gtpList;
  try{const r=await ghFetch('/contents/gtp?ts='+Date.now());GH.gtpList=Array.isArray(r)?r.filter(x=>x.type==='file').map(x=>({name:x.name,path:x.path,size:x.size})):[]}
  catch(e){GH.gtpList=e.status===404?[]:(GH.gtpList||[])}
  GH.gtpListAt=Date.now(); return GH.gtpList;
}
const gtpBusy=new Set();
async function gtpUpload(id,quiet){
  if(!ghOn()||gtpBusy.has(id))return false;
  const s=findSong(id),rec=await fileGet('gtp',id); if(!s||!s.gtp||!rec)return false;
  gtpBusy.add(id);
  try{
    const path=gtpPathFor(s,rec.name),old=s.gtp.path,sha=await ghFileSha(path);
    await ghFetch('/contents/'+encPath(path),{method:'PUT',body:JSON.stringify({message:'Песенник: GTP «'+(s.title||'')+'»',content:bufToB64(rec.buf),...(sha?{sha}:{})})});
    const cur=findSong(id); if(cur&&cur.gtp)await store.patch(id,{gtp:{...cur.gtp,path},updatedAt:Date.now()});
    if(old&&old!==path)gtpGhDelete(old); // the file used to be named by the song's number
    GH.gtpList=null;
    if(!quiet)toast('GTP-файл сохранён на GitHub');
    return true;
  }catch(e){if(!quiet)toast('Не удалось загрузить GTP-файл на GitHub: '+ghErrText(e));return false}
  finally{gtpBusy.delete(id)}
}
async function gtpFetch(s){
  if(!ghOn()||!s.gtp||!s.gtp.path||navigator.onLine===false)return null;
  try{
    const buf=await ghGetRaw(s.gtp.path);
    const rec={buf,name:s.gtp.name,size:buf.byteLength,added:Date.now()};
    await filePut('gtp',s.id,rec); return rec;
  }catch(e){toast('Не удалось скачать GTP-файл с GitHub: '+(e.status?ghErrText(e):'нет связи'));return null}
}
async function gtpGhDelete(path){
  if(!ghOn()||!path)return;
  try{const sha=await ghFileSha(path);if(sha)await ghFetch('/contents/'+encPath(path),{method:'DELETE',body:JSON.stringify({message:'Песенник: GTP удалён',sha})})}catch{}
  GH.gtpList=null;
}
/* a song without a GTP file picks up the one named after it */
async function gtpAutoAttach(s,list){
  if(!ghOn()||!s||s.demo||s.gtp||navigator.onLine===false)return false;
  list=list||await gtpList();
  const slug=gtpSlug(s),hit=list.find(f=>gtpBase(f.name)===slug);
  if(!hit)return false;
  await store.patch(s.id,{gtp:{name:hit.name,size:hit.size,path:hit.path},updatedAt:Date.now()});
  return true;
}
/* after a sync: upload files that live only here, rename ones still named by number, attach files to re-added songs */
async function gtpPending(){
  if(!ghOn())return;
  for(const s of S.songs.filter(x=>x.gtp&&(!x.gtp.path||x.gtp.path!==gtpPathFor(x,x.gtp.name)))){if(await fileGet('gtp',s.id))await gtpUpload(s.id,true)}
  const list=await gtpList(true); let n=0;
  for(const s of S.songs.filter(x=>!x.gtp))if(await gtpAutoAttach(s,list))n++;
  if(n)toast('GTP-файлы подключены к песням: '+n);
}
